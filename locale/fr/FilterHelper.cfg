[fh]
button-tooltip=__1__\n__CONTROL__pipette__ pour pipeter à l'emplacement du curseur.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__ pour appliquer le filtre.\n__CONTROL_RIGHT_CLICK__ pour supprimer le filtre.
tooltip-container-filters=__CONTROL_LEFT_CLICK__ pour appliquer le filtre.\n__CONTROL_RIGHT_CLICK__ pour supprimer le filtre.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ pour appliquer le filtre à tous les emplacements de cet objet.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ pour appliquer ce filtre à tous les emplacements valides.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ pour appliquer ce filtre à [font=default-bold]tous[/font] les emplacements.\n(__CONTROL_KEY_SHIFT__ ou __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__ pour supprimer ce filtre de tous les emplacements.
tooltip-requests=__CONTROL_LEFT_CLICK__ pour augmenter la demande de 1 pile.\n__CONTROL_RIGHT_CLICK__ pour diminuer la demande de 1 pile.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ pour augmenter la demande de 5 piles.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__ pour diminuer la demande de 5 piles.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ pour définir la demande de manière à remplir le conteneur.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__ pour supprimer la demande.
filters-full=Filtres complets
filters-empty=Filtres vides
requests-full=Demandes complètes
requests-empty=Demandes vides

[mod-setting-name]
fh-set-filter-on-inserter=Activer les filtres lors de la configuration du filtre pour le bras
fh-default-item-on-splitter=Configurer un objet pour qu'il s'affiche toujours sur les répartiteurs
fh-add-fuel-items=Ajouter des objets de carburant compatible aux filtres
fh-show-only-unlocked-qualities=Afficher uniquement les qualités de résultat pour les qualités débloquées

[mod-setting-description]
fh-set-filter-on-inserter=Active la case à cocher "Utiliser les filtres" lors de la configuration d'un filtre pour un bras
fh-default-item-on-splitter=Nom interne d'un objet à afficher systématiquement sur les répartiteurs, par exemple "deconstruction-planner". Laisser ce champ vide pour désactiver cette option.
fh-add-fuel-items=Ajoute les objets de carburant compatible et leurs résultats, même s'ils n'apparaissent pas dans les entrées et les sorties
fh-show-only-unlocked-qualities=Une machine disposant de modules de qualité n'affichera pas, dans les filtres de résultats, les qualités supérieures à celles qui ont été recherchées.

