[mod-setting-description]
propertyrandomizer-preset=Faites votre choix parmi une sélection de préréglages. Utilisez __CONTROL__randomizer-panel__ dans le jeu pour accéder à l'outil de personnalisation et bénéficier d'un contrôle plus précis.
propertyrandomizer-seed=Si vous modifiez ce paramètre, cela changera la manière dont tout est généré aléatoirement.
propertyrandomizer-watch-the-world-burn=Règle la difficulté sur "Le pire", le chaos sur "Ultime", ajoute une multitude de doublons pour prolonger la partie et active toutes les options aléatoires. Comprend également quelques… "ajustements". Prend le pas sur tous les paramètres ci-dessous. N'est pas nécessairement compatible avec les mods autres que l'Ère spatiale, ni avec les joueurs au cœur fragile.
propertyrandomizer-bias=Dans quelle mesure le processus d'aléatoire devrait-il chercher à faire pencher la balance en votre faveur ?
propertyrandomizer-chaos=Comment le hasard fait bien les choses. Jouer avec des valeurs plus élevées se fait à vos risques et périls.
propertyrandomizer-dupes=Faut-il inclure les doublons de recettes, d'entités, etc. importantes ?
propertyrandomizer-logistic=Combien de paramètres logistiques différents faut-il rendre aléatoires ? Par exemple, les vitesses des convoyeurs/bras, les longueurs des convoyeurs souterrains, la zone de distribution des poteaux électriques, etc.
propertyrandomizer-production=Nombre de caractéristiques de production différentes à rendre aléatoires. Par exemple, les capacités des machines, telles que leur vitesse pour fabriquer des objets et le nombre d'emplacements pour des modules.
propertyrandomizer-military=Nombre de paramètres militaires à rendre aléatoires. Par exemple, la vitesse de tir des armes, les dégâts supplémentaires, etc. Réduisez ce paramètre ou désactivez-le si vous rencontrez des difficultés face aux Biters.
propertyrandomizer-misc=Combien d'éléments divers et variés faut-il rendre aléatoires (ceux qui n'entrent pas dans les catégories ci-dessus) ? J'avais quelques idées créatives pour bon nombre d'entre eux.
propertyrandomizer-technology=Générer aléatoirement l'arbre technologique (quelles technologies sont des prérequis pour quelles autres).
propertyrandomizer-recipe=Rendre aléatoire les ingrédients des recettes.
propertyrandomizer-recipe-science-pack=Si l'aspect aléatoire des ingrédients des recettes est activée, cette option limite son application aux recettes du pack de science uniquement.
propertyrandomizer-recipe-tech-unlock=Détermine de manière aléatoire la technologie permettant de débloquer une recette.
propertyrandomizer-recipe-tech-unlock-duplicates=Ajoute un exemplaire supplémentaire de chaque recette débloquée dans l'arbre technologique afin de remédier aux problèmes de progression.
propertyrandomizer-item=Modifie la place des objets dans le jeu. Par exemple, au lieu d'extraire du charbon, vous pourriez pêcher du poisson, ou les fours pourraient remplacer les circuits parmi les intermédiaires les plus courants.
propertyrandomizer-item-percent=Quel pourcentage des objets non liés aux ressources devrait être rendu aléatoire ?
propertyrandomizer-item-retries=L'aléatoire des objets est capricieux. On effectue donc plusieurs tentatives au cas où l'une d'entre elles échouerait. Cela peut allonger considérablement le temps de chargement s'il y a plusieurs échecs.
propertyrandomizer-unified-retries=L'aléatoire unifié peut parfois échouer elle aussi. C'est pourquoi plusieurs tentatives sont effectuées afin d'éviter les erreurs au démarrage. Cela peut également allonger le temps de chargement si de nombreux échecs se produisent.
propertyrandomizer-unified-tech-prereqs=Fonctionne de la même manière que la configuration aléatoire des prérequis avec une technologie non unifiée, mais utilise un nouvel algorithme unifié. Cet algorithme unifié exécute les processus aléatoires simultanément et sera le mode par défaut dans les prochaines versions.
propertyrandomizer-unified-recipe-tech-unlocks=Fonctionne de la même manière que la configuration aléatoire non unifiée, mais avec un nouvel algorithme unifié. L'algorithme unifié exécute les processus aléatoires simultanément et sera l'option par défaut dans les prochaines versions.
propertyrandomizer-unified-spoiling=Rend aléatoire ce qui pourrit, mais pas ce en quoi les objets se transforment (le pourrissement reste donc un résultat habituel). Utilise un nouvel algorithme unifié qui exécute les processus aléatoires simultanément et qui deviendra la valeur par défaut dans les prochaines versions.
propertyrandomizer-unified-tech-science-packs=Rend aléatoire les packs de science requis par les technologies. Utilise un nouvel algorithme unifié qui exécute les processus aléatoires simultanément et qui deviendra la valeur par défaut dans les prochaines versions.
propertyrandomizer-unified-entity-operation-fluid=Rend aléatoire les fluides nécessaires au fonctionnement d'une machine (carburant pour lance-flammes, fluide pour réacteur à fusion, etc.). Utilise un nouvel algorithme unifié qui exécute les processus aléatoires simultanément et qui deviendra la valeur par défaut dans les prochaines versions.
propertyrandomizer-unified-mining-fluid-required=Rend aléatoire la quantité de fluide nécessaire pour extraire une ressource, ainsi que la présence ou non d'un besoin en fluide. Utilise un nouvel algorithme unifié qui exécute les processus aléatoires simultanément et qui deviendra la valeur par défaut dans les prochaines versions.
propertyrandomizer-unified-entity-autoplace=
propertyrandomizer-unified-recipe-ingredients=
propertyrandomizer-unified-item-ingredients=
propertyrandomizer-unified-item=
propertyrandomizer-unified-technology-delinearization=L'aléatoire technologique génère des arbres technologiques très linéaires. Cette option modifie le processus d'aléatoire spécifiquement pour les technologies, afin que l'arbre devienne moins linéaire. Ne s'applique qu'à l'aléatoire technologique unifié.
propertyrandomizer-icon=Toutes les icônes du jeu sont sélectionnées au hasard. Tu es fou ?
propertyrandomizer-sound=Tous les sons du jeu sont sélectionnés de manière aléatoire. Qui es-tu ?
propertyrandomizer-gui=La position des recettes dans l'interface graphique est aléatoire. Mais qu'est-ce que ça veut dire ?
propertyrandomizer-locale=Mélange les noms de tous les éléments du jeu. Pourquoi ?
propertyrandomizer-colors=Chaque valeur de couleur est déterminée de manière aléatoire. Comment ?...
propertyrandomizer-numerical-algorithm=Vous avez le choix entre deux algorithmes utilisés pour rendre aléatoires les propriétés numériques. L'un génère une courbe en cloche sans coupures, tandis que l'autre effectue un parcours aléatoire plus prudent. Cela n'a aucune incidence sur les aléatoires non numériques (comme les ingrédients d'une recette).
propertyrandomizer-overrides=Pour une personnalisation encore plus sophistiquée. Consultez le fichier README pour plus d'informations. Le fichier README se trouve dans le dossier du mod sur votre ordinateur ou en ligne à l'adresse suivante : github.com/exfret/propertyrandomizer

