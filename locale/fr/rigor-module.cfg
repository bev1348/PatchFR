rigor-module-disable-rigor-effect=[img=utility/warning_icon]AVERTISSEMENT[img=utility/warning_icon] À n'utiliser que si vous savez ce que vous faites !\nCe paramètre ne doit être utilisé que pour synchroniser un fichier de sauvegarde avant de désinstaller ce mod ou avant de modifier des paramètres susceptibles d'entraîner la disparition d'entités.

[tips-and-tricks-item-name]
rigor-module-mod-tip-1=Rigeur
rigor-module-mod-tip-2=Probabilités de rigueur

[tips-and-tricks-item-description]
rigor-module-list=[item=rigor-module] Module de rigueur \n[item=rigor-module-2] Module de rigueur 2 \n[item=rigor-module-3] Module de rigueur 3
rigor-module-mod-tip-1=La rigueur est un nouvel effet de module, fourni par [tooltip=Rigor Modules,tips-and-tricks-item-description.rigor-module-list]. La rigueur augmente les probabilités qu'une recette donne son résultat le plus précieux. La rigueur ne peut s'appliquer qu'à un produit dont le résultat est aléatoire, et ne peut concerner qu'un seul produit par recette. La rigueur ne s'applique pas non plus aux recettes de recyclage, à l'exception de [recipe=scrap-recycling].\nPour savoir si (et de quelle manière) une recette est affectée par la rigueur, consultez la fiche de la recette dans la Factoriopédie.
rigor-module-mod-tip-2=La rigueur augmente la probabilité qu'une recette produise le résultat donné.\nPour une probabilité 'p', la nouvelle probabilité est égale à 'p/(1-p)'.\nPour une probabilité 'p' et une rigueur 'r', la nouvelle probabilité est calculée à l'aide de la formule suivante : 'r*p/(r*p - p + 1)'.\nLes recettes peuvent également présenter une "sensibilité" à la rigueur. Une sensibilité supérieure à '1' signifie que la rigueur modifie davantage les probabilités, tandis qu’une sensibilité inférieure à '1' signifie qu’elle les modifie moins (pour une sensibilité 's', la rigueur effective est 'r*s'). Une sensibilité négative signifie que la rigueur diminue les probabilités au lieu de les augmenter (elle modifie '1-p' au lieu de 'p').

