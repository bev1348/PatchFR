rigor-module-compatibility-mode=Le mode de compatibilité exige que les recettes soient explicitement ajoutées à la liste par un mod pour pouvoir utiliser les modules de rigueur. Il est recommandé de n'activer le mode de compatibilité que si ce mod pose des problèmes de compatibilité avec d'autres mods.
rigor-module-compatibility-mode-include-vanilla=Toutes les recettes éligibles de Factorio standard (y compris celles de l'extension de l'Ère spatiale) doivent-elles être ajoutées à la liste du mode  de compatibilité ? Cela ne s'applique que si le mode de compatibilité est activé.
