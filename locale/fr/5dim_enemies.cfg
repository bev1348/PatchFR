[mod-setting-description]
5d-laser-biter=Activer la résistance aux dégâts causés par le laser pour les mordeurs
5d-physical-biter=Activer la résistance aux dégâts physiques pour les mordeurs
5d-impact-biter=Activer la résistance aux dégâts causés par les chocs et les explosions pour les mordeurs
5d-railgun-biter=Activer la résistance aux dégâts physiques infligés par les tirs de canon électromagnétique pour les mordeurs (nécessite l'Ère spatiale)
5d-fire-spitter=Activer les cracheurs de feu qui projettent des jets de feu
5d-rocket-spitter=Activer les cracheurs qui tirent des missiles
5d-suicide=Activer les cracheurs qui explosent au contact
5d-laser-spitter=Activer les cracheurs qui tirent des rayons laser
5d-physical-spitter=Activer les cracheurs qui lancent des pierres/débris
5d-poison-spitter=Activer les cracheurs qui génèrent des nuages toxiques
5d-electric-spitter=Activer les cracheurs avec des attaques par décharge électrique
5d-broodmother-biter=Activer les mordeurs qui font apparaître des petits lorsqu'ils meurent
5d-broodmother-spitter=Activer les cracheurs qui font apparaître des petits lorsqu'ils meurent
5d-swarm-biter=Activer les petits mordeurs rapides qui attaquent en grand nombre
5d-regenerator-biter=Activer les mordeurs qui régénèrent leurs points de vie extrêmement rapidement
5d-regenerator-spitter=Activer les cracheurs qui régénèrent leurs points de vie extrêmement rapidement
5d-berserker-biter=Activer les mordeurs agressifs qui infligent beaucoup de dégâts mais ont peu de vie
5d-tank-biter=Activer les mordeurs extrêmement résistants (de 50 % à tous les types de dégâts), mais infligeant peu de dégâts
5d-tank-spitter=Activer les cracheurs extrêmement résistants (de 50 % à tous les types de dégâts), mais infligeant peu de dégâts
5d-tank-worm=Activer les vers extrêmement résistants (de 50 % à tous les types de dégâts), mais infligeant peu de dégâts
5d-railgun-spitter=Activer les cracheurs qui tirent avec un canon électromagnétique (nécessite l'Ère spatiale)
5d-worm=Activer les vers énormes et Boss
5d-railgun-worm=Activer les vers qui tirent avec un canon électromagnétique (nécessite l'Ère spatiale)
5d-boss=Activer les Boss (niveau 11) qui apparaissent à un niveau d'évolution très avancé
5d-death-effects=Activer les effets de mort spéciaux pour les ennemis élémentaires (feu, poison, électricité, etc.)
5d-death-effect-scale=Échelle des effets de mort (0,25 = plus faible, 3,0 = beaucoup plus important)
5d-typed-damage=Activer les dégâts de type pour les attaques ennemies (les cracheurs de infligent des dégâts de type feu, etc.)
5d-attack-stickers=Activer les indicateurs sur les attaques ennemies (le feu provoque des brûlures, le poison provoque un ralentissement)
5d-health-multiplier=Multiplicateur de la santé des ennemis (plus la valeur est élevée, plus les ennemis sont résistants)
5d-damage-multiplier=Multiplicateur des dégâts infligés par les ennemis (plus la valeur est élevée, plus les attaques sont dangereuses)
5d-speed-multiplier=Multiplicateur de la vitesse de déplacement des ennemis (plus la valeur est élevée, plus les ennemis sont rapides)

