[tips-and-tricks-item-description]
5dim-enemies-intro=5Dim's Enemies propose une refonte complète du système d'ennemis, avec des types d'ennemis spécialisés, un système de progression à 10 niveaux et des boss.\n\nChaque type d'ennemi possède des caractéristiques, des résistances et des comportements uniques qui nécessitent des stratégies différentes pour être vaincus. Apprenez à connaître chaque type afin de préparer vos défenses en conséquence.
5dim-enemies-tiers=Dans 5Dim, les ennemis apparaissent désormais selon 10 niveaux (MK1 à MK10), auxquels s'ajoutent de puissantes variantes Boss.\n\n[font=default-bold]Progression des niveaux :[/font]\n• Les niveaux évoluent en fonction du facteur d'évolution\n• Les niveaux supérieurs ont plus de points de vie, infligent plus de dégâts et possèdent des résistances plus élevées\n• 3 niveaux sont actifs à chaque niveau d'évolution\n• Chaque type a des plages d'évolution différentes\n\n[font=default-bold]Boss :[/font]\n• Apparaissent à un niveau d'évolution élevé (90 % et +)\n• 2x plus de points de vie et de dégâts : x2\n• Taille x2 (visuellement plus grands)\n• Plus lents mais bien plus dangereux
5dim-enemies-full-battle=Observez tous les types d'ennemis coopérer lors d'un assaut combiné contre une défense fortifiée !\n\n[font=default-bold]Ennemis présents dans cette bataille :[/font]\n• Mordeurs normaux, laser, physiques et à impact\n• Reine-mère (apparaît avec des petits à sa mort)\n• Mordeurs d'essaim (nombreux petits ennemis rapides)\n• Mordeurs régénérateurs et Berserker\n• Cracheurs de feu, lance-missiles, de poison et électriques\n\n[font=default-bold]Configuration de la défense :[/font]\n• Tourelles mitrailleuses (ligne de front)\n• Tourelles laser (dégâts élevés)\n• Tourelle lance-flammes (dégâts de zone)\n• Murs en pierre (protection)
5dim-enemies-normal-biter=Les mordeurs standard apparaissent de la même manière que les ennemis de base.\n\n[font=default-bold]Caractéristiques :[/font]\n• Aucune résistance particulière\n• Statistiques équilibrées pour tous les niveaux\n• Taux d'apparition : de 0 % à 80 %\n\n[font=default-bold]Stratégie :[/font]\nTous les types d'armes sont efficaces. Idéal pour tester des configurations défensives.
5dim-enemies-laser-biter=[color=#4444FF]Mordeurs de couleur bleue[/color] dotés d'une forte résistance au laser.\n\n[font=default-bold]Caractéristiques :[/font]\n• Résistance aux dégâts laser supérieure à 85 %\n• Vulnérabilité physique normale\n• Apparition entre 10 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des tourelles mitrailleuses, des lance-flammes ou de l'artillerie. Les tourelles laser sont pratiquement inutiles contre eux.
5dim-enemies-physical-biter=[color=#AAAAAA]Mordeurs blindés gris/argentés[/color] dotés d'une grande résistance aux balles.\n\n[font=default-bold]Caractéristiques :[/font]\n• Résistance aux dégâts physiques de plus de 85 %\n• Réduction importante des dégâts (diminue les dégâts de manière régulière)\n• Apparition entre 10 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des tourelles laser, des lance-flammes ou des explosifs. Les tourelles mitrailleuses infligent très peu de dégâts.
5dim-enemies-impact-biter=[color=#8B4513]Puissants mordeurs brun foncé[/color] qui infligent des dégâts d'impact.\n\n[font=default-bold]Caractéristiques :[/font]\n• 30 % de santé en plus par rapport à la normale\n• 50 % de dégâts en plus\n• Vitesse de déplacement réduite de 15 %\n• Résistants aux dégâts d'impact\n• Apparition entre 10 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nIls sont plus lents, donc les techniques mobiles (kiting) sont efficaces. Utilisez des armes à longue portée pour réduire leurs effectifs avant qu'ils n'atteignent vos murs.
5dim-enemies-broodmother-biter=[color=#FF00FF]Mordeurs magenta/rose[/color] qui génèrent une progéniture lorsqu’ils sont tués.\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé supplémentaire (résistants)\n• Vitesse de déplacement réduite de 30 %\n• Dégâts infligés réduits de 20 %\n• [color=red]À la mort : 50 % de probabilité d’apparaître un mordeur de niveau inférieur[/color]\n• Apparaissent entre 25 % et 100 % de l'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des armes infligeant des dégâts élevés pour les éliminer d'un seul coup lorsque c'est possible. Les armes à zone d'effet permettent de venir à bout des petits qui apparaissent. Les lance-flammes sont excellents, car ils infligent des dégâts à la fois à la mère et à sa progéniture.
5dim-enemies-swarm-biter=[color=#FFD700]Petits mordeurs dorés/beiges[/color] qui attaquent en grand nombre.\n\n[font=default-bold]Caractéristiques :[/font]\n• 75 % de santé en moins (très fragiles)\n• 50 % de dégâts en moins\n• Vitesse de déplacement 50 % plus rapide\n• Taille réduite de 70 % (plus petits)\n• [color=cyan]Les nids produisent deux fois plus d'unités avec une vitesse deux fois plus élevée[/color]\n• Apparition entre 10 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLes armes à zone d'effet sont particulièrement efficaces ici. Les lance-flammes, les missiles et les grenades peuvent anéantir des essaims entiers. Les armes ciblant une seule cible seront submergées.
5dim-enemies-regenerator-biter=[color=#00FF00]Mordeurs vert citron vif[/color] qui se soignent extrêmement vite.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de santé en moins\n• [color=cyan]Vitesse de régénération 5 fois plus rapide[/color]\n• [color=red]Vulnérables au feu (-25 % de résistance)[/color]\n• Apparaissent entre 20 % et 100 % d’évolution\n\n[font=default-bold]Stratégie :[/font]\nConcentrez vos tirs pour les éliminer rapidement, ou utilisez des dégâts de feu pour exploiter leur faiblesse. Si vous les laissez battre en retraite, ils reviendront avec toute leur santé presque instantanément.
5dim-enemies-berserker-biter=[color=#CC0000]Mordeurs rouge sang[/color], puissants mais fragiles\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé en moins\n• [color=red]Dégâts multipliés par 2 (très dangereux !)[/color]\n• Vitesse de déplacement augmentée de 30 %\n• [color=cyan]Impossible de se soigner[/color]\n• Subit 10 % de dégâts physiques supplémentaires\n• Apparaissent entre 25 % et 100 % d’évolution\n\n[font=default-bold]Stratégie :[/font]\nÉliminez-les avant qu’ils n’atteignent vos murs ! Il est essentiel de disposer d’une puissance de feu élevée. Ils infligent des dégâts dévastateurs mais meurent rapidement. Les murs sont essentiels pour les ralentir.
5dim-enemies-tank=[color=#808000]Ennemis vert olive militaire[/color] qui résistent de manière égale à tous les types de dégâts.\n\n[font=default-bold]Disponibles en :[/font]\n• Mordeurs\n• Cracheurs\n• Vers\n\n[font=default-bold]Caractéristiques :[/font]\n• [color=cyan]50 % de résistance à TOUS les types de dégâts[/color] (physiques, laser, feu, poison, électriques, explosion, acide, impact)\n• [color=cyan]2x plus de points de vie[/color] (extrêmement résistants)\n• [color=red]65 % de dégâts en moins[/color]\n• Vitesse de déplacement réduite de 20 %\n• Pas de réduction régulière des dégâts, uniquement en pourcentage\n• Apparaissent entre 15 % et 100 % d’évolution\n\n[font=default-bold]Stratégie :[/font]\nAucun type d’arme n’est particulièrement efficace ou inefficace contre eux. Utilisez vos armes offrant le taux de dégâts le plus élevé. Leurs faibles dégâts signifient qu’ils ne constituent pas une menace immédiate, mais ils peuvent détourner l’attention de vos défenses pendant que des ennemis plus dangereux s’approchent.
5dim-enemies-fire-spitter=[color=#FF6600]Cracheurs de feu orange[/color] qui lancent des projectiles enflammés.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de points de vie en moins par rapport aux cracheurs normaux\n• Dégâts de feu infligés au fil du temps à l'impact\n• Crée un sol enflammé\n• Apparaissent entre 20 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLeurs projectiles peuvent mettre le feu à votre base. Utilisez des pavements en pierre ou en béton autour des tourelles. Un équipement résistant au feu vous aidera à vous défendre.
5dim-enemies-rocket-spitter=[color=#FFFF66]Cracheurs jaune pâle[/color] qui tirent des missiles explosifs.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de santé en moins que les cracheurs normaux\n• Dégâts de zone explosifs\n• Dégâts de zone à l'impact\n• Apparaissent entre 30 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nRépartissez vos défenses pour minimiser les dégâts de zone. Les murs aident à absorber les impacts des missiles. Cibles prioritaires à éliminer.
5dim-enemies-suicide-spitter=[color=#9900CC]Cracheurs violet foncé[/color] qui explosent à leur mort.\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé en moins\n• Vitesse de déplacement augmentée de 50 %\n• [color=red]Dégâts multipliés par 5 lors de l'explosion ![/color]\n• Apparaissent entre 30 % et 100 % d’évolution\n\n[font=default-bold]Stratégie :[/font]\nÉliminez-les à distance avant qu’ils n’atteignent votre base. Leurs explosions peuvent détruire les tourelles et les murs. Ne les laissez jamais s’approcher des infrastructures critiques.
5dim-enemies-poison-spitter=[color=#006600]Cracheurs vert foncé[/color] qui infligent des dégâts de poison.\n\n[font=default-bold]Caractéristiques :[/font]\n• Dégâts de poison sur la durée\n• Effet de poison cumulable\n• Apparition entre 20 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLe poison peut endommager vos structures au fil du temps. Les kits de réparation et les robots sont indispensables. Les boucliers personnels aident à contrer les dégâts de poison.
5dim-enemies-electric-spitter=[color=#00FFFF]Cracheurs cyan vif[/color] qui infligent des dégâts de foudre en chaîne.\n\n[font=default-bold]Caractéristiques :[/font]\n• Dégâts électriques/de foudre\n• Peuvent sauter d'une cible à l'autre à proximité\n• Apparition entre 30 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nEspacez vos tourelles pour éviter les dégâts en chaîne. Les positions défensives isolées sont plus efficaces que les regroupements denses.
5dim-enemies-railgun=[color=#008080]Ennemis bleu sarcelle[/color] issus de l'Ère spatiale, dotés d'une résistance au canon électromagnétique.\n\n[font=default-bold]Disponibles en :[/font]\n• Mordeurs\n• Cracheurs\n• Vers\n\n[font=default-bold]Caractéristiques :[/font]\n• Haute résistance aux dégâts de canon électromagnétique et aux projectiles perforants\n• Apparaissent entre 20 % et 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des armes conventionnelles. Les canons électromagnétiques et les projectiles perforants sont moins efficaces.
5dim-enemies-bosses=[color=#6600CC]Les Boss[/color] sont des variantes gigantesques et puissantes de chaque type d'ennemi.\n\n[font=default-bold]Multiplicateurs pour les Boss :[/font]\n• 2x plus de points de vie\n• 2x plus de dégâts\n• 2x plus grands (visuellement)\n• Mouvement 40 % plus lent\n\n[font=default-bold]Conditions pour que les boss apparaissent :[/font]\n• Commencent à apparaître à 90 % d’évolution\n• Taux d’apparition maximal à 100 % d’évolution\n• Tous les types d’ennemis ont des variantes Boss\n\n[font=default-bold]Stratégie :[/font]\nLes Boss nécessitent une puissance de feu concentrée. L’artillerie, les missiles et les tirs ciblés des tourelles sont essentiels. Ils sont lents, profitez-en !

