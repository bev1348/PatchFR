[technology-description]
ir3-loader=Remplit ou vide les conteneurs, les wagons de marchandises et les machines, au débit maximum des convoyeurs.
ir3-beltbox=Quadruple le débit des convoyeurs pour les lingots et les autres pavés en les attachant en paquets.

[IndustrialRevolution3]
menu_ir-stacking=Chargeurs et Empaqueteurs
title_ir-stacking=Chargeurs et Empaqueteurs 
paragraph_ir-stacking_1=Les [img=item/ir3-express-loader] [font=default-semibold][color=255,230,192]Chargeurs[/color][/font] vous permettent de charger des objets dans un conteneur ou une machine au débit maximum d'une ligne de convoyeurs, ou bien de décharger à toute vitesse les inventaires sur un convoyeur. Ils fonctionnent avec les coffres et autres conteneurs semblables, les wagons de marchandises, et les machines de fabrication/traitement. Ils nécessitent d'être alimentés en énergie pour fonctionner (selon le tier, via la vapeur ou l'électricité). Chaque tier de chargeur fonctionne à la même vitesse que le tier de convoyeur respectif. Notez qu'avec les machines d'assemblage, les chargeurs ne respectent pas la limite d'insertion des bras robotisés et continueront d'entasser autant d'ingrédients que possible dans l'entrée de la machine.
paragraph_ir-stacking_2=La direction d'un chargeur ne peut pas être modifiée après sa construction: à la place, la commande "rotation des objets" (__CONTROL__rotate__) bascule le mode de fonctionnement du chargeur entre charge et décharge d'inventaires. Un filtre peut être configuré sur les chargeurs en décharge uniquement. Si "Connexion automatique chargeur-convoyeur" est activée (dans Options > Options des Mods > Par carte), les nouveaux chargeurs construits connectés à un convoyeur accorderont leur mode de fonctionnement à la direction du convoyeur.

paragraph_ir-stacking_3=Les [img=item/ir3-express-beltbox] [font=default-semibold][color=255,230,192]Empaqueteurs[/color][/font] sont de petites machines conçues pour travailler main dans la main avec les chargeurs. Ils permettent de quadrupler le débit par convoyeurs, mais seulement pour les lingots du même type et d'autres objets en forme de pavés. La liste des objets emballables par paquets est disponible en survolant l'emplacement d'entrée vide d'un empaqueteur. Chargez des lingots dans un empaqueteur avec un chargeur et ils seront attachés par paquets. Amenez ces paquets de lingots dans un autre empaqueteur, et ils seront déballés en objets uniques. Les paquets d'objets ne peuvent pas être utilisés par les recettes, donc le cas d'usage type est d'empaqueter les objets en entrée d'un bus et de les déballer à l'entrée des sous-usines.
paragraph_ir-stacking_4=Les empaqueteurs peuvent être réglés en "mode lots" (dans Options > Options des Mods > Démarrage). Cela encourage les chargeurs à placer les piles d'objets de chaque côté des convoyeurs, au risque d'avoir besoin d'une quantité tampon d'objets en entrée.


