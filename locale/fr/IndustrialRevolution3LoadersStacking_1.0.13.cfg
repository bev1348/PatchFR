[mod-setting-description]
ir3ls-belt-snapping=Si cette option est activée, raccorder un nouveau chargeur à un convoyeur changera le mode du chargeur pour correspondre à la direction du convoyeur.
ir3ls-enabled=Activer ou non les machines selon vos préférences. À noter que l'option "Seulement les chargeurs" supprimera tous les paquets de lingots du monde lorsqu'elle est modifiée en cours de partie.
ir3ls-batch-mode=Par défaut, les empaqueteurs produisent des paquets un par un. En "mode lots", l'empaquetage est effectué quatre par quatre: quatre paquets sont produites simultanément en quatre fois plus longtemps. Le "mode lots" encourage les chargeurs de sortie à repartir les paquets des deux côtés des convoyeurs; petit bémol: si le débit d'entrée est faible, le débit de sortie sera très discontinu. Le déballage n'est pas affecté car il produit déjà plusieurs objets.

