[technology-description]
bet-charger=Chargeurs plus rapides pour les batteries de trains.
bet-charger-tertiary=Chargeurs de batteries qui ne consomment que l'énergie inutilisée et ne puisent jamais dans les accumulateurs.
bet-fuel=Des batteries de train améliorées offrant une autonomie accrue, une accélération plus rapide et une vitesse de pointe plus élevée.
bet-fuel-recycling=Recyclez les vieilles batteries de train pour en récupérer 90 % du contenu.
bet-tech=Des trains électriques fonctionnant avec des batteries réutilisables pouvant être rechargées dans des bornes de recharge fixes.


[mod-setting-name]
bet-battery-slots=Emplacements pour batteries de la locomotive
