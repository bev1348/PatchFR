bet-charging-efficiency=Rendement de charge
bet-cheatsy-braking=Multiplicateur de force/puissance de freinage
bet-cheatsy-locs=Activer les paramètres de triche pour la locomotive
bet-cheatsy-power=Puissance d'accélération de la locomotive
bet-cheatsy-speed=Vitesse maximale
bet-cheatsy-wagons=Activer les paramètres de triche pour le wagon
bet-equipment-gridtype=Grille d'équipement pour locomotives
bet-recycling=Recyclage des batteries
bet-return-partial-batteries=Retour des batteries partiellement déchargées

[mod-setting-description]
bet-battery-slots=Nombre d'emplacements de carburant dont dispose une locomotive électrique à batterie. Ce mod est conçu pour un seul emplacement et devrait être utilisé ainsi. Ce paramètre a pour but de contourner un bug du mod LTN, qui génère des conditions de ravitaillement impossibles à satisfaire pour les locomotives n'acceptant qu'un seul objet de carburant. Si vous utilisez LTN, réglez ce paramètre sur 2 et le multiplicateur de capacité sur 0,5. [1 – 5]
bet-capacity-multiplier=Les capacités des quatre niveaux de batteries des trains sont calculées sur la base des stocks complets de charbon, de combustible solide, de carburant pour fusées ou de combustible nucléaire du train. Si cela ne suffit pas ou si vous souhaitez disposer d'une capacité plus importante plus tôt dans la partie, augmentez ce multiplicateur. Le temps de recharge et les ingrédients nécessaires à la fabrication des batteries augmenteront en conséquence. [0,1 – 100]
bet-charging-efficiency=1,0 correspond à un rendement de charge parfait. Utilisez des valeurs inférieures à 1 pour augmenter la difficulté, ou des valeurs supérieures à 1 pour tricher et vous offrir de l'énergie gratuite. [0,1 – 1000]
bet-cheatsy-braking=Augmentez (ou réduisez) la force et la puissance de freinage des wagons et des locomotives électriques à batterie (si activé) en utilisant ce multiplicateur. 1 = aucun changement. [0,1 – 100 000]
bet-cheatsy-locs=Définir la vitesse maximale et la puissance d'accélération des locomotives électriques à batterie.
bet-cheatsy-power=Puissance d'accélération des locomotives électriques à batterie (si activé). [100 – 100 000 kW]
bet-cheatsy-speed=Vitesse maximale des wagons et des locomotives électriques à batterie (si activé). [10 – 7 386,3 km/h]
bet-cheatsy-wagons=Augmenter la vitesse maximale de tous les wagons de marchandises, d’artillerie et wagons-citernes afin qu’elle corresponde à celle de la locomotive.
bet-equipment-gridtype=Choisissez le type de grille d'équipement provenant d'autres mods que vous souhaitez utiliser pour les locomotives électriques à batterie.
bet-recycling=Environ 90 % des batteries réelles peuvent être recyclées. Ajoutez donc quelques recettes de recyclage de batteries pouvant faire l'objet de recherches. Cela peut entraîner des problèmes de compatibilité avec d'autres mods de recyclage.
bet-return-partial-batteries=Lorsque vous récupérez ou démantelez une locomotive électrique à batterie contenant une batterie partiellement déchargée, renvoyez cette batterie au lieu de la jeter. Cette option est désactivée pour économiser un peu de performances.


