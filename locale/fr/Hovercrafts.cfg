[mod-setting-name]
hovercraft-drifting=Mode de dérive
hovercrafts-electric=Aéroglisseurs électriques et laser

[mod-setting-description]
hovercraft-drifting=Permet à l'aéroglisseur de dériver pendant les virages ("Ancien"/"Nouveau"), ou offre la même fonctionnalité mais avec une latence réduite en mode multijoueur, au prix d'une dérive légèrement moins prononcée ("Faible latence A et B"). Attention : probabilité de rester coincé sur des falaises, des rochers et d'autres entités.
hovercrafts-electric=Active l'aéroglisseur électrique et l'aéroglisseur laser. Tous deux fonctionnent à l'électricité. Placez un transformateur ainsi que des réacteurs portables ou des panneaux solaires dans la grille d'équipement. Désactivez pour les retirer tous les deux.

