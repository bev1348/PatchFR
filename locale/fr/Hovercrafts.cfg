[technology-description]
hovercraft=Un aéroglisseur non armé conçu pour être rapide et maniable avec une armure de protection minimale.
electric-hovercraft=Un aéroglisseur électrique non armé.  Il renonce à l'armure de protection pour permettre une vitesse et une maniabilité optimales.
missile-hovercraft=Un aéroglisseur armé de missiles. Il renonce à la vitesse et à la maniabilité au profit d'une armure de protection accrue et d'une résistance accrue aux dommages.
laser-hovercraft=Une version armée de l'aéroglisseur électrique.  Il est bien équilibré en termes de vitesse, d'agilité, de blindage léger et de résistance aux dommages.
ehvt-equipment=Un transformateur capable de réguler la puissance pour soutenir le fonctionnement des moteurs électriques de grande capacité.

