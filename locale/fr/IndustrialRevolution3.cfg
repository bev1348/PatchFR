[technology-description]
advanced-military-science-pack=Débloque les recherches de développement d'armement avancé.
atomic-bomb=C'est la seule façon d'en être sûr.
automation-4=Processus d'assemblage spécialisés via lasers, pour tous vos besoins en précision de pointe.
battery-equipment=Un accumulateur portatif. Il se charge en électricité grâce aux générateurs personnels, puis la libère si besoin.
battery-mk2-equipment=Un accumulateur portatif amélioré. Il se charge en électricité grâce aux générateurs personnels, puis la libère si besoin.
battery=Accumule une charge électrique dans des cellules électrochimiques et la décharge dans des générateurs à batteries ou des véhicules.
coal-liquefaction=Le charbon, c'était le feu à l'ère du bronze, mais maintenant c'est loin derrière vous.
electric-engine=Des moteurs électriques avancés avec un couple supérieur.
energy-weapons-damage=Augmente les dégâts causés par les lasers et les autres armes à faisceaux énergétiques.
engine=Un moteur de plusieurs chevaux-vapeurs, nécessaire pour propulser les véhicules et entraîner les machineries lourdes.
fusion-reactor-equipment=Le tristement célèbre "M. Reactor" d'Acme Corp. Toutes les joies du flux neutronique dans votre poche. Recharge les batteries de votre armure en utilisant des barres d'uranium. Il n'explosera pas, probablement.
gun-turret=Une tourelle mitrailleuse automatique. Ce design est étrangement familier.
heavy-armor=Une armure de bronze solide, contenant une petite grille d'équipements personnel.
inserter-capacity-bonus=Les bras robotisés haute-capacité déplaceront plus d'objets d'un coup
ir-advanced-batteries=Des batteries améliorées au plomb, avec une capacité quatre fois plus grande.
ir-advanced-engine=Un moteur plus puissant. Et tout brillant.
ir-air-compression=Utilise des filtres absorbants pour capturer la pollution ambiante, et comprime l'air aspiré.
ir-arc-furnace=Fabriquer des objets... SANS lingots? Quelle folie!
ir-arc-turret-equipment=Une tourelle à arcs portative à ajouter aux équipements personnels.
ir-arc-turret=Envoie des décharges électriques étourdissantes qui ralentissent les ennemis.
ir-barrelling=Remplie des réservoirs avec des liquides pour le transport ou la recharge de carburant.
ir-blast-furnace=Les hauts fourneaux sont extrêmements chauds et rapides, ils nécessitent du coke en guise de carburant. Ils sont spécialisés dans le traitement du fer, du cuivre, de l'acier et du silicium.
ir-brass-milestone=Ce n'est pas vraiment le même laiton qu'à la maison, mais c'est dur, brillant et facile à usiner, donc ça ira.
ir-bronze-forestry=Une exploitation forestière autonome, qui produit du bois lentement mais sûrement.
ir-bronze-furnace=Des fours améliorés, ça veut dire des matériaux améliorés. Des matériaux améliorés, ça veut dire des fours améliorés. Vous, vous voulez les fours.
ir-bronze-milestone=Le bronze est un métal solide et résistant à la corrosion, dont les propriétés dépassent celles de ses constituants.
ir-bronze-telescope=Observe des trucs très loin.
ir-charcoal=La roue ET le feu, dès le premier jour? Pas si vite, monsieur.
ir-chrome-forestry=Une exploitation forestière accélérée, stimulée par de l'engrais, produisant du bois de manière fiable.
ir-chromium-milestone=Le chrome est un élément extrêmement dur et résistant, mais cassant sous sa forme pure. Il est utilisé dans les alliages et pour le placage.
ir-coking=La pyrolyse du charbon produit du coke, un carburant plus pur utile pour les réductions de métaux.
ir-concrete=Un matériau de construction très utile. Bye bye, les briques.
ir-coolant=Certaines machines et certains équipements fonctionnent à haute température. Leur raccorder un système de refroidissement leur permet de mieux gérer les excès de chaleur.
ir-copper-derrick=Extrait de la vapeur saine de fissures à vapeur.
ir-crude-oil-processing=Pompez du pétrole brut vers la surface, puis fractionnez-le en produits utiles.
ir-cryogenics=Se sert de températures négatives intenses pour liquéfier les gaz et séparer les mélanges de gaz.
ir-electric-furnace=Au lieu de directement brûler du carburant, ce four fait chauffer à blanc des bobines d'induction grâce à l'électricité pour la fonte de métaux.
ir-electronics=Combine et modifie des signaux électroniques.
ir-electroplating=Plus connu sous le nom de "placage", ces techniques permettent d'augmenter la résistance et la durabilité des composants.
ir-electrum-milestone=Un alliage cristallin avancé, doté d'une durabilité exceptionnelle et de propriétés électromagnétiques atypiques.
ir-ethanol=Traitement de biomasse ou d'autres hydrocarbures pour produire un alcool léger, utile et peu polluant.
ir-force-fields=Dispositifs électromagnétiques capables de dévier, d'absorber, d'attirer ou de repousser des objets en manipulant les champs de forces.
ir-gas-furnace=Des fours à gaz avec une efficacité énergétique décente.
ir-gasification=Adaptez vos processus de séparation du gaz naturel pour qu'ils fonctionnent avec des carburants solides.
ir-geothermal-exchange=Utilise de la vapeur polluée et brûlante issue de sources souterraines pour faire bouillir de l'eau saine.
ir-glass-milestone=Le verre plat est un verre issu du flottage à l'étain. C'est un matériau transparent et bon isolant, mais qui se brise facilement.
ir-gold-milestone=Le temps passe... Vous vous poser quelque part, et entonnez un chant sur l'or.
ir-graphene=Des films d'atomes de carbone ordonnés incroyablement résistants, fabriqués par dépôt laser de polymères en atmosphère inerte.
ir-graphite=Les crayons sont enfin à votre portée! ... tout comme de nouveaux matériaux avancés.
ir-grinding=Vous pouvez broyer et allier des ressources pour extraire plus de minerai et crée de nouveaux matériaux.
ir-heavy-oil-processing=Avoir trop de lubrifiant, ce n'est pas toujours désirable. Voici une méthode pour raffiner le pétrole lourd en fractions plus utiles.
ir-heavy-picket=Une plateforme de construction flottante, mobile et rapide.
ir-heavy-roller=Une plateforme de construction lente mais bien solide.
ir-high-pressure-canisters=Stockez des gaz liquéfiés et d'autres fluides volatiles en toute sécurité dans ces bobonnes.
ir-hydrogen-battery=Un type de batteries renouvelables et hi-tech.
ir-inserters=Des améliorations pour vos serviteurs robotiques: plus malin, plus rapides, plus forts.
ir-iron-forestry=Exploitation forestière améliorée, qui produit du bois lentement mais sûrement.
ir-iron-milestone=Travailler avec le fer débloquera bientôt la puissance de l'électron.
ir-iron-motor="La fortune des hommes est une roue et ne laisse pas toujours les mêmes au sommet."
ir-lampbot=Les robolampes volent sur place et projettent de la lumière dans une direction. Ils peuvent être récupérés et repositionnés.
ir-lead-milestone=Le plomb est un matériau toxique mais très dense, utile pour les blindages.
ir-light-oil-processing=Le pétrole léger, c'est très utile pour enflammer des trucs, mais il existe des carburants plus flexibles et moins polluants.
ir-logistics-depot=Rajoutez des interfaces de réseau logistiques à vos conteneurs.
ir-mining=Des machines améliorées pour piller encore plus de ressources naturelles.
ir-modules=Programmez des ordinateurs pour perfectionner les opérations de vos machines. Les ordinateurs peuvent être réinitialisés et reprogrammés.
ir-monowheel=Un véhicule personnel original, sans arme et avec une capacité de chargement minimale.
ir-natural-gas-processing=Le gaz naturel, c'est bien sympa. Mais l'hydrogène, c'est fondamental, littéralement.
ir-nickel-milestone=Le nickel est un métal dur mais cassant, qu'il vaut mieux utiliser en alliage ou comme agent de placage.
ir-nickelsteel-milestone=L'acier au nickel est un alliage très solide avec une haute résistance thermique.
ir-normal-inserter-capacity-bonus=Les bras robotisés classiques déplaceront plus d'objets d'un coup.
ir-nuclear-fuel=C'est un mystère, mais ça marche.
ir-petroleum-processing=Le gaz de pétrole possède plusieurs usages clés, mais parfois on a besoin de plus de coke ou de gaz naturel.
ir-photon-turret-damage=Augmente les dégâts infligés par les torpilles photoniques.
ir-photon-turret=Lancez les torpilles!
ir-plastiglass=Un plastique flexible mais solide et incassable, aussi transparent que le verre.
ir-pressing=Un banc haute pression - haute température, capable de synthétiser des cristaux extrêmement durs.
ir-racing-monowheel=Excellente vitesse de pointe et freins améliorés. Aucune arme, capacité de chargement minimale.
ir-radar=Cartographie les environs à l'aide d'ondes radio réfléchies.
ir-reclamation=Cette machine démantèle des objets afin de récupérer une partie des métaux et du verre utilisés lors de leur fabrication.
ir-research=Des installations avancées qui repoussent les limites de la technologie.
ir-robot-battery=Augmente la quantité d'énergie que les robots ouvriers sont capables de stocker.
ir-robotower=Une adaptation des technologies de roboport personnel pour créer des réseaux logistiques, desservis par des robots transporteurs de marchandises.
ir-rocket-propellant=Des bonbonnes d'hydrogène et d'oxygène liquéfiés, adaptés pour l'envoie de véhicules en orbite.
ir-rocket-speed=Augmente la cadence de tir des lance-missiles.
ir-scatterbot=Leurs vies sont courtes et brutales, mais même à leurs manières simplettes, ils vous aiment.
ir-scattergun-turret=Recrutez quelques soldats de métal pour canarder vos ennemis.
ir-solar-energy=Génère une puissance électrique limitée grâce aux rayons du soleil.
ir-steam-power=Enfin! Vous pouvez générer un courant électrique grâce aux machines à vapeur, alimentés par de la vapeur sous pression.
ir-steambot=Un robot de construction primitif. Ne bénéficie pas des recherches sur la vitesse de déplacement.
ir-steel-derrick=Permet d'extraire n'importe quel gaz ou vapeur émanant de fissures.
ir-petro-generator=Des bobines électromagnétiques entraînées en rotation par des hydrocarbures fluides: une source d'énergie relativement compacte.
ir-steel-milestone=Vous découvrez comment produire de l'acier, une forme plus solide et moins cassante du fer.
ir-steel-wall=Peut-être que les déchiqueteurs paieront pour celui-là...
ir-storage-depot=Sympa, ce centre de stockage que tu as là. Ce serait dommage qu'il lui arrive quelque chose.
ir-transmat=En d'autres termes, des téléporteurs. La probabilité que votre ADN soit échangé avec celui d'un déchiqueteur est plutôt faible.
ir-washing=Purifie les minerais broyés, ce qui améliore encore le rendement et permet d'extraire des minéraux secondaires.
ir-water-electrolysis=Briser les liaisons chimiques des molécules d'eau par électrolyse est une manière très peu efficace d'en séparer l'hydrogène et l'oxygène. Mais si vous avez l'énergie nécessaire...
laser-turret=Brûle des gros trous dans des trucs. Pew pew!
laser=Les rayons de lumière focalisée peuvent couper, souder, voir tuer.
low-density-structure=L'injection de gaz inertes dans des alliages en fusion permet de produire des structures de faible densité.
lubricant=Supprimer les impuretés de du pétrole lourd produit un lubrifiant utile aux mécanismes.
personal-roboport-equipment=Équipez des outils de construction améliorés sur votre armure de puissance.
physical-projectile-damage=Augmente les dégâts infligés par les balles et les obus.
robotics=Des stations robotisées robustes, capables de couvrir une plus grande zone d'action, qui possèdent plus de stations de recharge et une plus grande capacité de stockage.
rocket-fuel=Un mélange optimal de carburants, conçu pour les locomotives et autres véhicules.
space-science-pack=Envoyer des satellites en orbite pour récupérer des données cosmiques.
weapon-shooting-speed=Augmente la cadence de tir pour toutes les balles et tous les obus.
worker-robots-speed=Augmente la vitesse de déplacement des robots de construction et des robots logistiques. N'affecte pas les robots mécanopunks.
ir-medical-pack=Une manière plus efficace de se soigner que les sushis de perches aliens. Par contre, vous ne pourrez pas vous en servir aussi souvent.
ir-silicon=Un métalloïde très utile, qui ouvre la porte à la conception de matériel électronique avancé.
ir-silicon-carbide=Le carbure de silicium: un isolant thermique avancé, essentielle à la fabrication de fours avancé et à la manipulation de métaux en fusion.
ir-bitumen-upgrading=Réduire la viscosité du bitume par injection de diluant permet de le convertir en pétrole brut de synthèse.
ir-rocket-turret=Tire des salves de missiles, possède un système de visée filtré. Prenez des précautions quant à l'usage de missiles explosifs.

