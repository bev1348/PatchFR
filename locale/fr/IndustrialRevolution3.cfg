paragraph_IndustrialRevolution3_1=Bienvenue à Industrial Revolution 3 (IR3). Dans le menu à gauche de la page, vous pourrez trouver des informations détaillées sur les mécaniques principales du mod.
paragraph_IndustrialRevolution3_2=Voici quelques conseils généraux vis-à-vis des différences par rapport à Factorio de base:
paragraph_IndustrialRevolution3_3=Ce mod a été réalisé par Deadlock989, 2018-2023, en à peu près 3000 heures. License: CC BY-NC-ND 4.0. Amusez-vous bien! (Traduction FR: Supershadow30)

bullet_IndustrialRevolution3_1=Fabriquer des machines à la main vous prendra très longtemps, car il y a vraiment beaucoup plus de composants et produits intermédiaires. Vous feriez mieux d'automatiser leur production.
bullet_IndustrialRevolution3_2=Vous ne pouvez pas faire fondre du fer en début de partie (à moins que vous n'ayez changé le niveau technologique de départ dans les paramètres de démarrage du mod).
bullet_IndustrialRevolution3_3=Lorsque vous débloquerez la fonte du fer, le gisement de minerai de fer le plus proche risque d'être assez éloigné. Vous pourriez avoir besoin d'y installer un avant-poste temporaire.
bullet_IndustrialRevolution3_4=Une carte générée avec des paramètres chauds et/ou sec rendra l'accès au caoutchouc bien plus difficile. Il faudra explorer plus loin pour trouver des hévéas.
bullet_IndustrialRevolution3_5=Les Monoroues sont des véhicules débloqués assez tôt. Ces véhicules sont moins chers et plus rapides que les voitures, elles faciliteront l'exploration en début de partie. Elles ne sont cependant pas armées.
bullet_IndustrialRevolution3_6=L'usage de circuits logiques est presque incontournable pour de nombreuses chaines de transformation, notamment pour le raffinage du pétrole et la purification de minerais.
bullet_IndustrialRevolution3_7=Pensez toujours à vérifier les statistiques des machines et des recettes avant de spammer des plans. Ne vous fiez pas aux ratios du jeu de base.

paragraph_ir_entity_toggle_1=IR3 ajoute une [font=default-semibold][color=255,230,192]Commande "Changer de Mode"[/color][/font] (__CONTROL__ir-entity-adjustment__) qui vous permet d'intéragir avec certaines machines sans avoir à ouvrir leur interface.
paragraph_ir_entity_toggle_2=Pour changer la configuration des machines suivantes, il vous suffit de la survoler avec la souris et d'appuyez sur la commande. 

bullet_ir_entity_toggle_1=Les [font=default-semibold][color=255,230,192]Trains[/color][/font] basculent entre la conduite manuelle et autonome. Si vous êtes à bord du train, pas besoin de le survoler avec la souris pour ça.
bullet_ir_entity_toggle_2=Les [font=default-semibold][color=255,230,192]Canons Photoniques[/color][/font] basculent entre un mode de ciblage étroit et large.
bullet_ir_entity_toggle_3=Les [font=default-semibold][color=255,230,192]Lampes Éthérées[/color][/font] basculent entre une conduite continue (deux connexions) ou un embout de conduite (une connexion).
bullet_ir_entity_toggle_4=Les [font=default-semibold][color=255,230,192]Interrupteurs[/color][/font] sont ouverts ou fermés.
bullet_ir_entity_toggle_5=Les signaux de sortie d'un [font=default-semibold][color=255,230,192]Émetteur de Constante[/color][/font] sont activés ou désactivés.
bullet_ir_entity_toggle_6=Les [font=default-semibold][color=255,230,192]Coffres[/color][/font] et autres conteneurs effectuent des transferts de stocks sans avoir à les ouvrir (plus d'informations dans [font=default-semibold][color=255,230,192]Transferts de Stocks[/color][/font]).
bullet_ir_entity_toggle_7=Les [font=default-semibold][color=255,230,192]Générateurs à Batteries[/color][/font] changent de priorité de génération électrique (plus d'informations dans leur infobulle).
bullet_ir_entity_toggle_8=Les [font=default-semibold][color=255,230,192]Moules à Métaux[/color][/font] change de types de composants produits (lingots, plaques, engrenages, barre).
bullet_ir_entity_toggle_9=Les [font=default-semibold][color=255,230,192]Machines de Mise en Baril[/color][/font] basculent entre les modes remplissage et vidange.
bullet_ir_entity_toggle_10=Les [font=default-semibold][color=255,230,192]Chaudières Électriques[/color][/font] et les [font=default-semibold][color=255,230,192]Échangeurs Géothermiques[/color][/font] basculent entre une sortie d'eau chaude ou de vapeur.
bullet_ir_entity_toggle_11=Les [font=default-semibold][color=255,230,192]Valves[/color][/font] basculent entre 3 modes: anti-retour, trop-plein et appoint. Toutes les valves ont un effet anti-retour de fluide. Les valves de trop-plein bloque le flux de fluide si l'entrée n'est pas remplie à 80% ou plus. Les valves d'appoint bloque le flux de fluide si la sortie est remplie à plus de 80%. Les valve de trop-plein et d'appoint ont un débit plus faible que les tuyaux normaux et les valves anti-retour; elles sont plus efficace lorsqu'elles sont directement attachées à un réservoir. Si vous souhaiter avoir un control plus précis des flux et un meilleur débit de fluide sans restrictions, utilisez plutôt des pompes controllées par circuit logique.
bullet_ir_entity_toggle_12=Les [font=default-semibold][color=255,230,192]Tourelles Lance-Missiles[/color][/font] ignorent les cibles petites et moyennes par défaut, mais peuvent être configurées pour attaquer n'importe quelle cible.

paragraph_ir_fuelman_1=IR3 ajoute des générateurs et des équipements personnels qui consomment des bobonnes de carburant ou des batteries chargées pour fonctionner. Les véhicules nécessite aussi du carburant pour se déplacer ou utiliser leur équipement personnel, s'ils en possèdent. La gestion simultanée de différents carburants pour différentes systèmes peut être une tâche assez fastidieuse. Heureusement, IR3 possède un  système capable de s'en occuper.
paragraph_ir_fuelman_2=Si vous possédez des générateurs dans votre armure de puissance, ou que vous conduisez un véhicule qui consomme du carburant, un bouton de la barre d'accès rapide vous permet d'activer/désactiver le gestionnaire de carburant (commande actuelle: __CONTROL__ir-control-fuel-manager__). Lorsque le gestionnaire est actif, il vérifie périodiquement les emplacements de carburant disponibles. S'il en trouve qui arrivent à cours de carburant, il les rechargera automatiquement tant que vous avez un carburant compatible dans votre inventaire principal. S'il y a des objets dans les emplacements de carburant épuisé (comme des bobonnes vides ou des batteries déchargées), le gestionnaire essayera de les décharger vers votre inventaire.
paragraph_ir_fuelman_3=Lorsque des objets sont déplacés entre les inventaires, une notification apparaîtra au-dessus de votre personnage, détaillant quels et combien d'objets ont été déplacés. Si le gestionnaire rencontre un souci, la notification affichera un ou plusieurs avertissements:
paragraph_ir_fuelman_4=Lorsque vous conduisez un véhicule, ses emplacements de carburant et son équipement sont gérés de la même manière que votre équipement personnel. Le gestionnaire a accès à la fois à votre propre inventaire et celui du véhicule. Pour l'équipement de votre armure, votre inventaire est utilisé en priorité, par rapport à celui de votre véhicule, comme source de carburantn. Pour les véhicules, leur inventaire respectif prend la priorité. Les locomotives ne sont pas prises en charge par le gestionnaire, même en mode manuel.
paragraph_ir_fuelman_5=Lorsqu'un emplacement de carburant est vide, le gestionnaire essaiera de le recharger avec le premier carburant compatible qu'il détecte. Il donne priorité à l'inventaire lié à l'emplacement de carburant (inventaire de véhicule contre le votre), puis aux emplacements désignés (les carburants dans des emplacements désignés sont toujours utilisés avant ceux qui n'y sont pas), et enfin dans l'ordre de l'inventaire (de gauche à droite et de haut en bas).
paragraph_ir_fuelman_6=Vous pouvez désactiver certaines alertes et certains bruits dans Options > Options des mods > Par joueur.

bullet_ir_fuelman_1=Un emplacement de carburant arrive à court et pourrait être rechargé, mais vous n'avez pas de carburant du même type sur vous.
bullet_ir_fuelman_2=Un inventaire de carburant est vide, mais vous n'avez pas de carburant compatible.
bullet_ir_fuelman_3=Un emplacement de carburant épuisé contient des objets, mais il n'y a pas de place pour le décharger.

paragraph_ir_mining_1=Les [img=item/electric-mining-drill] [font=default-semibold][color=255,230,192]Foreuses Electriques[/color][/font] sont utilisées pour récolter les minerais habituels, la pierre et le charbon. Dans IR3, vous pourrez également trouver des gisements de [img=item/tin-ore] [font=default-semibold][color=255,230,192]Minerai d'Etain[/color][/font] et de [img=item/gold-ore] [font=default-semibold][color=255,230,192]Minerai d'Or[/color][/font]. Faire fondre le fer et l'or en lingots nécessite certaines recherches à développer. Pour démarrer, vos ressources principales sont le cuivre, l'étain, le charbon et la pierre.
paragraph_ir_mining_2=Les lingots sont le produit principal de l'extraction de métaux et représentent un morceau de métal relativement pure, utilisé par le suite en fabrication. Certains métaux élémentaires peuvent être combinés en alliages possédant de nouvelles propriétés; par exemple, allier de l' [img=item/tin-ingot] [font=default-semibold][color=255,230,192]Etain[/color][/font] et du [img=item/copper-ingot] [font=default-semibold][color=255,230,192]Cuivre[/color][/font] produit du [img=item/bronze-ingot] [font=default-semibold][color=255,230,192]Bronze[/color][/font].
paragraph_ir_mining_3=Le [img=item/nickel-pure][font=default-semibold][color=255,230,192]Nickel[/color][/font], le [img=item/lead-pure][font=default-semibold][color=255,230,192]Plomb[/color][/font], le [img=item/chromium-pure][font=default-semibold][color=255,230,192]Chrome[/color][/font], and le [img=item/platinum-pure][font=default-semibold][color=255,230,192]Platine[/color][/font] sont des minéraux métalliques rares présents en faible quantité dans les minerais d'autres métaux. Ils ne peuvent pas être extraits de manière indépendante: seul la purification des minerais permet d'en récupérer (plus d'informations dans "Traitements et Processus").
paragraph_ir_mining_4=Les [img=item/pumpjack] [font=default-semibold][color=255,230,192]Chevalets de Pompages[/color][/font] sont utilisés pour extraire du [img=fluid/crude-oil] [font=default-semibold][color=255,230,192]Pétrole Brut[/color][/font] du sol, comme dans le jeu de base. Vous pourrez aussi découvrir des fissures qui émettent de la vapeur ou d'autres gaz, qui peuvent être exploitées par une tour de pompage. Les [img=item/copper-derrick] [font=default-semibold][color=255,230,192]Tours de Pompage à Vapeur[/color][/font] ne peuvent être placées que sur les [img=fluid/steam] [font=default-semibold][color=255,230,192]Fissures à Vapeur[/color][/font] et sont auto-alimentées. Les [img=item/steel-derrick] [font=default-semibold][color=255,230,192]Tours de Pompage Electriques[/color][/font] peuvent être construites sur n'importe quel fissure et peuvent utiliser des modules. Contrairement aux puits de pétrole, les fissures à gaz émettent du gaz de manière cyclique: leur débit de sortie décroît jusqu'à atteindre un minimum, puis augmente d'un coup à pleine puissance.
paragraph_ir_mining_5=Vous aurez peut-être remarqué des rochers scintillants près des gisements de minerai. Ceux-ci contiennent des pierres précieuses.

paragraph_ir_pollution_control_1=La pollution dans Factorio fonctionne avec un système de "chunks", des zones du monde de 32x32 cases: vous pouvez voir la grille de chunks en mettant le jeu en pause. Chaque chunk possède un taux de pollution. Lorsqu'une machine [font=default-semibold][color=255,230,192]émet[/color][/font] de la pollution, celle-ci est ajouté au taux de pollution du chunk où elle se trouve. Au fil du temps, la pollution s'étale sur les chunks voisins; certains éléments naturels (tels que les arbres et les nids de déchiqueteurs) en absorbent une partie (plus de détails sont disponibles sur le wiki de Factorio). Si une machine émet une "pollution négative", alors elle [font=default-semibold][color=255,230,192]absorbe[/color][/font] une partie de la pollution du chunk. Cependant, le taux de pollution d'un chunk ne peut jamais être négatif.
paragraph_ir_pollution_control_2=IR3 ajoute quelques machines qui aident à mitiger les émissions de pollution. Lorsque vous survoler à la souris une machine qui a un effet d'absorption de pollution, les limites du [font=default-semibold][color=255,230,192]chunk affecté[/color][/font] sont mises en évidence.

bullet_ir_pollution_control_1=Les [font=default-semibold][color=255,230,192]Compresseurs à Air[/color][/font] réduisent la pollution ambiante en produisant de l'air comprimé propre, ce qui consomme des filtres et de l'électricité.
bullet_ir_pollution_control_2=Les [font=default-semibold][color=255,230,192]Purificateurs d'Air[/color][/font] fonctionne comme des compresseurs, mais rejettent directement l'air purifié. Les effets dépolluants de plusieurs compresseurs et purificateurs dans un chunk s'additionnent sans restriction (jusqu'à ce que le taux de pollution du chunk soit nul).
bullet_ir_pollution_control_3=Les [font=default-semibold][color=255,230,192]Sylvicultures[/color][/font] ont aussi un effet de réduction de pollution (en plus de l'effet naturel des arbres qu'elles entretiennent), cependant leurs effets ne s'additionne pas dans un même chunk. Plus d'informations sont disponibles à la page "Sylviculture".

paragraph_ir_pollution_spill_1=Dans IR3, de nombreux fluides sont des polluants. Si un appareil de transport/stockage de fluide (tel qu'un [img=item/storage-tank] [font=default-semibold][color=255,230,192]réservoir[/color][/font] ou un [img=item/pipe] [font=default-semibold][color=255,230,192]tuyau[/color][/font]) est déconstruit alors qu'il contient un fluide polluant et qu'il n'y a pas de place pour ce fluide dans le reste du système, le fluide sera relâché dans la nature en un nuage de pollution instantanée. Des nuages de pollutions peuvent aussi être relâchés lors d'une vidange manuelle d'un système fluidique, ou lors de leur destruction par un ennemi ou une arme.
paragraph_ir_pollution_spill_2=Les gaz peuvent être évacués par un [img=item/iron-gas-vent] [font=default-semibold][color=255,230,192]Évent[/color][/font]: l'effet est équivalent à un flux continu de pollution lorsque le gaz est rejeté. Les liquides ne peuvent pas être évacués par évent (sauf les gaz liquifiés). Certains gaz, notament le [img=fluid/sulphur-gas] [font=default-semibold][color=255,230,192]Gaz Soufré[/color][/font] et le [img=fluid/carbon-gas] [font=default-semibold][color=255,230,192]Gaz Carbonique[/color][/font], devront sûrement être évacués par des évents: il faut les imaginer comme de la pollution concentrée que vous pouvez rejetter où bon vous semble.
paragraph_ir_pollution_spill_3=La quantité de pollution produite lorsqu'un nuage de gaz est relâché depends en partie de la nature du fluide, mais aussi et surtout de la quantité relâchée. Le contenu d'un seul tuyau est relativement négligeable, mais celui d'un réservoir rempli de 25 000 unités de fluide produit un nuage de pollution conséquent. Le plus risqué serait de faire la vidange d'une pipeline complète, ce qui pourrait créer un gigantesque nuage de pollution. À vous de voir si ça vous importe, bien sûr.
paragraph_ir_pollution_spill_4=Les fluides suivants ne créent [font=default-semibold][color=255,230,192]aucun[/color][/font] nuage de pollution, leur évacuation est parfaitement sans danger:

bullet_ir_power_sources_1=Les machines et équipements à [font=default-semibold][color=255,230,192]Combustion[/color][/font] utilisent du charbon ou un autre carburant solide pour fonctionner: ceux-ci incluent les chaudières, les fours, et les foreuses et bras robotisés à combustion. De manière générale, plus un carburant est raffiné, plus son potentiel énergétique augmente et/ou moins il est polluant. Les bras robotisés à combustion d'IR3 peuvent "voler" du carburant depuis la réserve d'une machine à combustion qu'ils déchargent.
bullet_ir_power_sources_2=Les [font=default-semibold][color=255,230,192]Machines à Vapeur[/color][/font] fonctionnent en transformant de la vapeur sous pression en travail mécanique. L'énergie à vapeur est la seule manière de mettre en place une chaîne de fabrication automatisée ou de traitement des minerais en début de partie. Les chaudières transforment l'eau en vapeur, qui peut alors alimenter les machines à vapeurs via des conduits.
bullet_ir_power_sources_3=Les [font=default-semibold][color=255,230,192]Machines Électriques[/color][/font] nécessitent d'être alimenté en énergie en étant connecté à un réseau électrique constitué de poteaux, pylônes et transformateurs.
bullet_ir_power_sources_4=Les [font=default-semibold][color=255,230,192]Machines à Carburant Fluide[/color][/font] brûlent directement des liquides ou gaz inflammables pour fonctionner (par exemple, les fours à gaz et les générateurs pétrochimiques).
bullet_ir_power_sources_5=Les [font=default-semibold][color=255,230,192]Batteries[/color][/font] sont des sources d'énergies rechargeables, "de l'électricité en bouteille". On peut s'en servir pour alimenter un réseau électrique grâce aux générateurs à batteries, pour alimenter des equipements personnel via un équipement de décharge, ou encore comme carburant renouvelable pour les véhicules et locomotives. Les batteries ont une faible chance d'être détruites lors de la charge; les batteries de plus haut niveau ont moins de chance d'être détruites.
bullet_ir_power_sources_6=Les carburants en [font=default-semibold][color=255,230,192]baril[/color][/font] ou en [font=default-semibold][color=255,230,192]bonbonnes[/color][/font] sont principalement utilisés par les véhicules, les locomotives et parfois l'équipement personnel. Une bonbonne ou un baril vide sont récupérés lorsque le carburant est utilisé.

paragraph_ir_processing_1=IR3 rajoute des étapes intermédiaires supplémentaires lors du traitement des minerais, afin d'augmenter la quantité de métal extrait et ce dès le début de partie. Dans certains cas, ces processus sont optionnels - vous pouvez toujours faire fondre du minerai tout juste miné - mais il y a toujours des avantages aux processus supplémentaires.
paragraph_ir_processing_2=Les [img=item/steel-grinder] [font=default-semibold][color=255,230,192]Broyeurs[/color][/font] sont en général utilisés pour pulvériser des minerais en pré-traitement ou de la pierre en gravier puis en silice. Broyer des minerais métalliques permet d'augmenter la nombre de lingots produits et de réduire la pollution produite lors de la fonte. Les broyeurs permettent aussi d'extraire la résine du bois de caoutchouc. Les [img=item/steel-mixer] [font=default-semibold][color=255,230,192]Mixeurs[/color][/font] ont un rôle similaire, mais utilisent plusieurs ingrédients en entrée, y compris des fluides, pour produire de nouveaux matériaux; les mixeurs nécessitent une configuration manuelle.
paragraph_ir_processing_3=Les [img=item/steel-washer] [font=default-semibold][color=255,230,192]Usines de Purification de Minerais[/color][/font] augmentent encore plus le rendement des minerais broyés, en les rinçant à l'eau chaude ou froide afin d'en retirer les impuretés pour ne garder que des minéraux purs. En prime, ce nettoyage permet d'extraire des minéraux rares impossibles à miner séparemment. Utiliser l'eau chaude d'une [img=item/steel-boiler] [font=default-semibold][color=255,230,192]Chaudière Électrique[/color][/font] permet de séparer plus efficacement les minerais secondaires, cependant vous n'en voudrez pas trop: un [img=item/green-wire] [font=default-semibold][color=255,230,192]Circuit Logique[/color][/font] connecté à des [img=item/pump] [font=default-semibold][color=255,230,192]Pompes[/color][/font] et des [img=item/small-tank] [font=default-semibold][color=255,230,192]Petits Réservoirs[/color][/font] peut être utilisé pour ajuster en autonomie des usines de purification afin de réguler la production de minéraux suivant la demande. Le cycle de purification produit de l'eau polluée: des [img=item/steel-cleaner] [font=default-semibold][color=255,230,192]Épurateurs[/color][/font] peuvent être utilisés pour récupérer de l'eau saine en partie, en filtrant les déchets.
paragraph_ir_processing_4=Les [img=item/iron-scrapper] [font=default-semibold][color=255,230,192]Recycleurs Industriels[/color][/font] transforment les objets assemblés en débris recyclables, tant que leur fabrication ait nécessité des métaux, de la pierre, du bois, du verre ou du béton. Ces débris peuvent ensuite être recyclés en lingots ou en plaque, ce qui permet de récupérer les ressources des objets indésirables. La quantité de matériaux récupérée est aléatoire à chaque opération, avec un rendement moyen de 75%. Le recyclage n'inverse que les processus de d'usinages: la fonte, le broyage et les transformations thermo-chimiques sont irréversibles. Certains objets ne peuvent pas être recyclés, comme par exemple les objets contenant du fluide (barils, bonbonnes, etc) ou les packs d'analyse.

paragraph_ir_transmats_1=Les transmats sont une application technique de la technologie des anneaux de champ quantique, ils emploient un tunnel subspatial afin de transférer les atomes d'un ingénieur d'une plateform à une autre, à vitesse extrême. Un réseau local de transmats peut être formé en en installant plusieurs sur la planète. Cliquer sur un transmat ouvre son interface et affiche les destinations possibles. Si les deux transmats ont leur status affiché [font=default-semibold][color=255,230,192]Prêt[/color][/font], le transport peut être initié en cliquant sur le bouton [font=default-semibold][color=255,230,192]Enclencher[/color][/font]. Les transmats ne peuvent être connectés que si l'ensemble des conditions suivantes est respecté:
paragraph_ir_transmats_2=Vous pouvez éditer le nom du transmat avec le bouton [img=edit-inline] [font=default-semibold][color=255,230,192]Editer[/color][/font]. Vous pouvez aussi activer un [img=map-marker-inline] [font=default-semibold][color=255,230,192]marqueur[/color][/font] sur la position du transmat.
paragraph_ir_transmats_3=Les concepteurs de la technologie des transmats n'assument aucune responsabilité en cas de lassitude existentielle ou dissociation clinique déclenchée à la suite d'un voyage en transmat, et tiennent à insister sur le fait parfaitement tangible que vous êtes toujours la même personne maintenant qu'auparavant, et non un parfait inconnu qui porte une reproduction de votre visage et rêve des reproductions de vos rêves.

bullet_ir_transmats_1=Au moins un ingénieur doit être sur le transmat de départ, à l'intérieur des anneaux de champ.
bullet_ir_transmats_2=Les deux transmats doivent chacun être chargés d'au moins __1__. Ni la distance de transport, ni le nombre de passagers n'affectent la quantité d'énergie requise.
bullet_ir_transmats_3=Le transmat d'arrivée ne doit pas être obstrué par un ingénieur. Les véhicules empêche le fonctionnement des transmats qu'ils soient sur l'entrée ou la sortie.

paragraph_ir_weapons_1=IR3 ajoute et change plusieurs mécaniques des armes et des munitions, et l'arbre de technologique militaire a été entièrement retravaillé. Dans ce mod, toutes les balles sont des objets physiques avec une vitesse de déplacement, qu'elles soient tirées d'un fusil à pompe, d'une mitrailleuse ou d'une tourelle. Les balles passe au dessus de vos propres constructions.

bullet_ir_weapons_1=Les [font=default-semibold][color=255,230,192]Tourelles Tromblon[/color][/font] sont vos premiers moyens de défense automatisés. Elles tirent des [img=item/shotgun-shell] [font=default-semibold][color=255,230,192]Cartouches[/color][/font] à faible portée qui se dispersent facilement.
bullet_ir_weapons_2=Les [font=default-semibold][color=255,230,192]Tourelles Mitrailleuses[/color][/font] ont plus de portée et vise les cibles individuellement. Elles utilisent des [img=item/firearm-magazine] [font=default-semibold][color=255,230,192]Chargeurs de Balles[/color][/font]. 
bullet_ir_weapons_3=Les [font=default-semibold][color=255,230,192]Tourelles Laser[/color][/font] tire un faisceau lumineux hautement énergétique sur une cible individuelle. Vous pouvez changer la couleur du faisceau dans les options du mod.
bullet_ir_weapons_4=Les [font=default-semibold][color=255,230,192]Tourelles à Arcs Électriques[/color][/font] ne font pas de dégâts: elles frappent un groupe d'ennemis avec une décharge électrique qui les ralentis pendant un moment.
bullet_ir_weapons_5=Les [font=default-semibold][color=255,230,192]Canons Photoniques[/color][/font] tirent des projectiles d'énergie explosifs assez mortels. Évitez de les orienter vers votre base. Leur mode de visée peut être modifié via la commande "changer de mode".
bullet_ir_weapons_6=En arme de dernier recours, les [font=default-semibold][color=255,230,192]Obus d'Artillerie Atomiques[/color][/font] sont dévastateurs contre les bases ennemies, mais relâchent un nuage de pollution massif.
bullet_ir_weapons_7=Les [font=default-semibold][color=255,230,192]Tourelles Lance-Missiles[/color][/font] lancent des salves de [img=item/rocket] [font=default-semibold][color=255,230,192]Missiles[/color][/font] téléguidés. Soyez prudent si vous utilisez des missiles explosifs. Les cibles à ignorer sont configurables via la commande "changer de mode".

paragraph_ir_melting_1=Les [img=item/stone-furnace][img=item/bronze-furnace][img=item/electric-furnace][img=item/steel-furnace] [font=default-semibold][color=255,230,192]Fours[/color][/font] servent en général à transformer des minerais métalliques en lingots. Vous pouvez pré-traiter les minerais dans des broyeurs ou des usines de purification pour extraire plus de métal et produire moins de pollution (plus d'informations dans "Traitement et Processus"). La plupart des fours sont capable de traiter des matériaux non-métalliques, tels que le verre et le graphite.
paragraph_ir_melting_2=Les [img=item/stone-alloy-furnace][img=item/bronze-alloy-furnace][img=item/electric-alloy-furnace] [font=default-semibold][color=255,230,192]Fours pour Alliages[/color][/font] sont capable de faire fondre plusieurs ingrédients pour produire des alliages et réductions métalliques (aciers). Ils nécessitent une configuration manuelle.
paragraph_ir_melting_3=Les [img=item/blast-furnace] [font=default-semibold][color=255,230,192]Hauts Fourneaux[/color][/font] sont des fours à combustion spécialisés pour la production efficace de matériaux clés. Ils fonctionnent à grande vitesse, mais nécessitent d'être alimentés en [img=fluid/air-gas] [font=default-semibold][color=255,230,192]Air Comprimé[/color][/font] et en [img=item/solid-fuel] [font=default-semibold][color=255,230,192]Coke[/color][/font].
paragraph_ir_melting_4=Les [img=item/arc-furnace] [font=default-semibold][color=255,230,192]Fours à Arc[/color][/font] nécessitent beaucoup de place et d'énergie, mais fonctionnent à très grande vitesse. Ils produisent du métal en fusion qui peut ensuite être moulé en lingots, en plaques, en engrenages, ou en barres grâce aux [img=item/steel-cast] [font=default-semibold][color=255,230,192]Moules à Métaux[/color][/font]. Le traitement de minéraux dans un four à arc demande un apport d'[img=fluid/oxygen-gas] [font=default-semibold][color=255,230,192]Oxygen Gazeux[/color][/font] pure. C'est la manière la plus productive de traiter les minerais: la chaîne complète (broyage, purification, fonte à l'arc puis moulage) permet d'extraire trois fois plus de lingots que la fonte de minerai non-traité. Les fours à arc ne peuvent pas fonctionner avec des minerais tout juste extrait ou broyés, seulement des métaux sous forme pure (y compris les lingots et les débris). Pour les recettes de recyclage, l'oxygen pure n'est pas nécessaire, mais il n'y a aucun bonus de production. Les métaux en fusion peuvent être directement mélangés pour créer des alliages en fusion.
paragraph_ir_melting_5=Les hauts fourneaux et les fours à arc ne sont pas des améliorations directes des fours électriques. Ils ont chacun des avantages et des inconvénients, et ils offrent plus de flexibilité en pleine partie. Ils produisent tous les deux du [img=fluid/carbon-gas] [font=default-semibold][color=255,230,192]Gaz Carbonique[/color][/font] en déchet, comme la plupart des processus chimiques. Le gaz carbonique a un usage de niche en sylviculture, mais dans la plupart des cas il sera nécessaire d'en rejeter par des évents (plus d'informations dans l'onglet "Nuages de Pollution").

paragraph_ir_forestry_1=Les sylvicultures sont des bâtiments qui entretiennent les arbres dans le même chunk afin d'automatiser la production de bois. Les [img=item/bronze-forestry] [font=default-semibold][color=255,230,192]Sylvicultures de Bronze[/color][/font] sont lentes mais ne requièrent que de l'eau pour fonctionner, pas de carburant. Les [img=item/iron-forestry] [font=default-semibold][color=255,230,192]Sylvicultures Électriques[/color][/font] sont plus rapides mais nécessitent de l'électricité. Les [img=item/chrome-forestry] [font=default-semibold][color=255,230,192]Sylvicultures Avancées[/color][/font] sont encore plus rapides et ont besoin d'électricité, d'engrais et de gaz carbonique. Toutes les sylvicultures ont un effet de réduction de pollution locale, en plus de l'absorption naturelle des arbres.
paragraph_ir_forestry_2=Le taux de production de bois dépend du nombre d'arbres sain dans le même chunk que la sylviculture, jusqu'à un maximum de __1__ arbres. Pas d'arbres, pas de bois; les arbres morts ou secs ne sont pas pris en compte. Les hévéas (arbres à caoutchouc) sont dominants: s'il y a des hévéas dans le chunk, les autres arbres sont ignorés. Les sylvicultures feront un bon départ si elles sont installées dans une forêt existante. Si ce n'est pas possible, vous pouvez fabriquer des [img=item/tree-planter-tree-01][img=item/tree-planter-ir-rubber-tree] [font=default-semibold][color=255,230,192]Arbustes[/color][/font] pour reforester manuellement un chunk. Les arbustes peuvent être inclus dans les plans, coupés-collés, et plantés par des robots.
paragraph_ir_forestry_3=Les populations d'arbres entretenus évoluent chaque cycle solaire. En général, le nombre d'arbre d'un chunk augmente jusqu'à atteindre le maximum. Les petites populations d'arbres s'accroissent plus lentement. Les nouveaux arbres ne poussent que sur des espaces vides, et ne peuvent pas pousser sur des sols artificiels comme la brique ou le béton. Cependant, les arbres entretenus meurent s'ils atteignent un niveau critique de dommages liés à la pollution, les populations d'arbres peuvent donc décroître, voir s'effondrer. Cela dépend des paramètres de carte: consultez le wiki officiel de Factorio sur les arbres pour plus de détails sur les dommages causés par la pollution. Les sylvicultures afficheront un [img=virtual-signal/ir-signal-toxic] [font=default-semibold][color=255,230,192]Avertissement[/color][/font] si elles détectent un niveau de pollution du chunk supérieur au seuil nocif.
paragraph_ir_forestry_4=Avoir plus d'une sylviculture par chunk n'offre aucun avantage. Les arbres disponibles sont répartis entre les sylvicultures: la même quantité de bois est produite en moyenne et la même quantité de pollution est absorbée. Survoler du curseur une sylviculture met en évidence les limites du chunk dans lequel elle se situe, les arbres qu'elle entretient, et les autres sylvicultures en concurrence dans le même chunk.

paragraph_ir_transfers_1=Les transferts de stocks sont un système low tech remplaçant la logistique personnelle, ils fonctionnent grâce aux emplacements d'inventaire filtrés. Ils affectent les inventaires suivants:
bullet_ir_transfers_1=Votre inventaire principal;
bullet_ir_transfers_6=Les emplacements de munitions de vos armes;
bullet_ir_transfers_2=L'inventaire (coffre et munitions) de n'importe quel véhicule (semblable à une voiture) que vous êtes en train de conduire;
bullet_ir_transfers_3=Les coffres et les autres conteneurs fixes.

paragraph_ir_transfers_2=Il y a deux manières de lancer un transfert de stocke. Soit vous construisez une [img=item/transfer-plate] [font=default-semibold][color=255,230,192]Plaque de Transfert[/color][/font] puis passez dessus pour déclencher un transfert, que ce soit en se déplaçant ou non: cela marche avec tous les conteneurs à portée de la plaque. Soit vous utilisez la [font=default-semibold][color=255,230,192]Commande "Changer de Mode"[/color][/font] (__CONTROL__ir-entity-adjustment__) sur un groupe de conteneur, mais vous devez définir les types de conteneur affectés (dans Options > Options des Mods > Par joueur). Les plaques de transfert ne sont pas affectées par cette commande et fonctionnent toujours avec tous les conteneurs supportés.
paragraph_ir_transfers_3=Lorsqu'un transfert est lancé, si vous avez filtré une parties de vos emplacements d'inventaire via __CONTROL__toggle-filter__, le transfert va tenter de charger ces emplacements en soutirant les objets compatibles des conteneurs à portée. Vous pouvez aussi vous débarasser de vos objets en configurant des emplacements filtrés dans un conteneurs capable d'en avoir (par exemple, les conteneurs non-logistiques). Cela ne s'applique pas aux emplacements de munitions. Les inventaires externes ont la priorité sur le votre: si un conteneur à portée possède des filtres en commun avec ceux de votre inventaire, les votres seront ignorés.

paragraph_ir_transfers_4=Quelques cas d'usages typiques des transferts de stocks:
bullet_ir_transfers_4=Automatiser les recharges de carburant: il suffit de désigner des emplacements pour les bonbonnes/batteries chargées dans votre inventaire, et de construire un coffre filtré qui récupère celles qui sont vides pour les fournir à un chargeur.
bullet_ir_transfers_5=Transports de stocks par voiture: Désigner des emplacements pour du minerai dans le coffre de la voiture, visiter un avant-poste de minage pour le remplir, puis les apporter à un centre de fonderie pour les y déposer, via des conteneurs filtrés. Même pas besoin d'arrêter la voiture.

paragraph_ir_transfers_5=Notez que certains objets ne peuvent pas être transférés. Notamment: les objets partiellement usés (ex: kits de réparation ou chargeurs de balles), les constructions endommagées, les objets capables d'en stocker d'autres (ex: les armures personnelles, les véhicules) et les objets spéciaux qui contiennent des informations (ex: les plans et autres planificateurs).

paragraph_ir_modules_1=Dans IR3, les modules sont utilisés de la même manière que dans le jeu de base et possède les même efets. Cependant, ils sont fabriqués de manière différente, et les machines et recettes qui les acceptent sont différentes. En général, seules les machines électriques acceptent les bonus de modules, et la plupart d'entre elles possèdent des emplacements de module. Les machines à vapeur ou à combustible n'acceptent ni les modules, ni les effets de diffuseurs de modules.
paragraph_ir_modules_2=Les trois types de modules ([img=item/efficiency-module-3] [font=default-semibold][color=255,230,192]efficacité[/color][/font], [img=item/speed-module-3] [font=default-semibold][color=255,230,192]vitesse[/color][/font], et [img=item/productivity-module-3] [font=default-semibold][color=255,230,192]productivité[/color][/font]) sont fabriqués à partir [img=item/computer-mk1][img=item/computer-mk2][img=item/computer-mk3] [font=default-semibold][color=255,230,192]d'ordinateurs[/color][/font]. Un module peut être transformé en ordinateur vierge en le [img=recipe/deprogram-effectivity-module-3] [font=default-semibold][color=255,230,192]reformatant[/color][/font]. Cela signifie qu'il est facile de convertir un module d'un type en un autre, ou de recycler les modules en ordinateur pour fabriquer autre chose. La production de modules automatisée nécessite un [img=item/module-loader] [font=default-semibold][color=255,230,192]programmateur de modules[/color][/font]. Les modules peuvent être programmés et formatés à la main, mais le programmateur est beaucoup plus rapide.
paragraph_ir_modules_3=Les bonus de [img=item/productivity-module-3] [font=default-semibold][color=255,230,192]Productivité[/color][/font] dans IR3 sont en général restreints au traitement et au raffinage de matériaux bruts (par exemple, le minage, le traitement des minérais, la fonderie, les réactions chimiques, etc). La fabrication de composants ou de machines en [img=item/assembling-machine-3] [font=default-semibold][color=255,230,192]assembleurs[/color][/font] n'est en général pas affecté par les bonus de productivité (sauf si d'autres mods l'autorise). Les [img=item/automation-science-pack] [font=default-semibold][color=255,230,192]Packs d'Analyse[/color][/font] sont une exception important: les bonus de productivité affectent autant leur fabrication en assembleurs et leur usage en laboratoires. La fabrication de [img=item/rocket-silo] [font=default-semibold][color=255,230,192]Partie de Fusée[/color][/font] accepte aussi les bonus de productivité.

# port
paragraph_ir_processing_4-quality=Les [img=item/iron-scrapper] [font=default-semibold][color=255,230,192]Recycleurs Industriels[/color][/font] transforment les objets assemblés en débris recyclables, tant que leur fabrication ait nécessité des métaux, de la pierre, du bois, du verre ou du béton. Ces débris peuvent ensuite être recyclés en lingots ou en plaque, ce qui permet de récupérer les ressources des objets indésirables. La quantité de matériaux récupérée est aléatoire à chaque opération, avec un rendement moyen de 55% (à cause du mod Qualité). Le recyclage n'inverse que les processus de d'usinages: la fonte, le broyage et les transformations thermo-chimiques sont irréversibles. Certains objets ne peuvent pas être recyclés, comme par exemple les objets contenant du fluide (barils, bonbonnes, etc) ou les packs d'analyse.

