ir3patchset-deadlock=La Clé de la Victoire.\nLancez cet objet ou n'importe quel satellite dans une fusée pour gagner le jeu.\nNote: Cet objet ne produit AUCUN pack d'analyse cosmique lorsqu'il est envoyé en orbite.

