[mod-setting-description]
ir-fuelman-inventorysounds=Les transferts d'inventaire du gestionnaire de carburant font un son discret.
ir-fuelman-inventorynumbers=Les transferts d'inventaire du gestionnaire de carburant affichent un texte volant qui indique combien et quels objets ont été déplacés.
ir-fuelman-pingemptyslot=Vous alerte dès qu'un emplacement de carburant est complètement vide et qu'il y a du carburant compatible disponible.
ir-fuelman-pingnofuel=Vous alerte dès qu'un emplacement de carburant a moins de carburant de quantité d'appoint, mais qu'il n'y a plus de ce carburant disponible.
ir-fuelman-pingnoinv=Vous alerte dès qu'un emplacement de carburant épuisé contient des objets, mais que vos inventaires n'ont pas de place pour les y décharger.
ir-fuelman-pingsounds=Les alertes du gestionnaire de carburant jouent un son.
ir-fuelman-spent-fuel-inventory=Si activé, le gestionnaire de carburant préfèrera toujours décharger les carburants épuisés dans l'inventaire principal du joueur; si désactivé, les carburants épuisés d'un véhicule seront déchargés dans l'inventaire de ce dernier.
ir-hide-redundancies=Cache les produits de base qui n'ont aucun usage connu (s'ils existent) des onglets de fabrication, ce qui empêche leur fabrication. Ils seront toujours affichés en tant qu'élements débloqués de technologies. Cela sert principalement à des fins de débogage, ce n'est pas très utile aux joueurs.
ir-laser-colour=Choisissez la couleur des rayons laser (tourelles, robots destructeurs, lasers de défense personnelle).
ir-no-blue-trees=Si activé, limite le canal bleu de la coloration RGB des feuillages à 80% de la valeur du canal vert (ce qui empêche les arbres d'être bizarrement bleus).
ir-starting-age=Vous permet de choisir un "âge de départ" afin de démarrer avec des technologies recherchées et un kit de départ approprié. Par défaut, vous commencez à l'"Âge de pierre" avec un kit de démarrage minimal et aucune technologie recherchée. N'a d'effet que lors de la création d'une nouvelle partie (n'a pas d'effet si la partie est déjà en cours).
ir-status-disabled=Couleur affichée lorsqu'une machine est désactivée par un signal du réseau logique (foreuses uniquement). Également utilisée dans l'interface des machines à l'arrêt pour toutes raisons autres que le manque d'énergie.
ir-status-full-output=Couleur affichée lorsque la machine est à l'arrêt à cause d'une sortie bloquée, ou lorsqu'elle est occupée par une autre tâche.
ir-status-idle=Couleur affichée lorsqu'une machine en attente d'instructions (machines de fabrication seulement).
ir-status-insufficient-input=Couleur affichée lorsqu'une machine n'a pas assez d'ingrédients pour compléter une tâche (machines de fabrication seulement).
ir-status-low-power=Couleur affichée lorsque la machine est en manque d'énergie (alimentation insuffisante ou charge interne trop faible).
ir-status-no-minable-resources=Couleur affichée lorsqu'une foreuse a épuisé les ressources qu'elle pouvait miner (foreuses uniquement).
ir-status-working=Couleur affichée lorsqu'une machine fonctionne normalement ou est prête à être activée.
ir-rail-blocks=Définie les couleurs utilisées pour la visualisation des blocs de rail (par exemple, lorsque vous placez un signal sur les rails).
ir-turret-runtime=Par défaut, les tourelles du monde sont colorées de la même couleur que le joueur ou la faction qui les possède. Vous pouvez également décider que chaque tourelle utilise la même couleur que son icône (c'est-à-dire des couleurs différentes pour chaque type de tourelle), ou choisir une couleur pour toutes les tourelles.
ir-research-notifications=Affiche une notification dans la console lorsque vous ou votre équipe obtenez une nouvelle technologie.
ir-driving-autocorrect=Cette option fait que lors de la conduite, la trajectoire de votre véhicule est lentement alignée suivant l'une des huit directions d'une boussole lorsque vous roulez sur des sols artificiels (ex: les briques, le béton, le tarmac). Ne s'applique que pour les véhicules semblables aux voitures (ex: les voitures, les tanks, les monoroues).
ir-belt-map-colours=Choisissez si les convoyeurs sont représentés sur la carte par la couleur par défaut ou une couleur dépendant de leur tiers. Si cette option est modifiée en cours de partie, des secteurs de la carte peuvent avoir besoin d'être rechargés pour que la nouvelle couleur soit affichée.
ir-fetchport-containers=Choisissez les types de conteneurs depuis lesquels vous pouvez récupérer des objets à distance, pour remplir vos emplacements filtrés d'inventaire (plus d'informations à la page "Transferts de Stocks" du Manifeste).
ir-bottomless-pit=Les puits sans fond vous permettent de faire disparaître des objets sans aucun coût. Ils rendent certains problèmes triviaux à résoudre et encouragent à gâcher des ressources. Vous pouvez lancer un millier de fusées dans IR3 sans faire disparaître un seul objet, donc les puits sans fond ne sont pas disponibles par défaut. Toutefois, ils sont très utiles dans certaines situations (ex: faire sortir les objets étrangers lors d'une contamination des lignes de convoyeurs), donc vous pouvez quand même les activer. Cette option peut être changée en cours de partie (en multijoueur, seulement par les admins). 
ir-trilinear-filtering=Le filtrage trilinéaire (TF en anglais) est une méthode de lissage des sprites qui réduit les artéfacts et les interférences qui apparaissent pour certains niveaux de zoom. Activer l'option a un impact mineur sur les performances des CPU/GPU. L'option "Recommandée" n'utilise le filtrage que pour quelques sprites d'IR3 peu communs qui en bénéficieraient le plus, par exemple: les véhicules et les générateurs. L'option "Plus de filtres" applique un filtrage sur encore plus d'animations de machines, par ex: les assemblers, les fours, les foreuses... L'option "Aucun filtre" désactive les filtres pour tous les sprites.
ir-ghost-tint=Teinte les fantômes d'entités avec une couleur spécifique.
ir-scrap-localisation=Ajoute une info-bulle à chaque objet pouvant être recyclé, indiquant le rendement maximal possible (le rendement moyen est de 75 % des valeurs indiquées). La plupart des joueurs trouveront cette information superflue.
ir-hide-military-technologies=Si vous jouez une partie sans ennemis, vous pourriez avoir envie de cacher les technologies militaires de l'arbre des recherches. Cela inclue les véhicules armés (voitures, tanks, et spidertrons), mais pas les véhicules sans armes d'IR3, les armures de puissance, et les équipements personnels qui ne sont pas des armes. Les technologies déjà recherchées sont toujours affichées. Cette option peut être modifiée en cours de partie (en multijoueur, seulement par les admins).
ir-transfer-plate-style=Choisissez si les plaques de transfert ne sont colorés qu'en gris métallique ou qu'elles reprennent les couleurs des coffres logistiques.
ir-inserter-overlays=Lorsque cette option est activée, une icône de source d'énergie et/ou de type est ajoutée aux icônes des bras robotisés.
ir-belt-brightness-variation=Si activé, certains objets sur des convoyeurs auront différents éclats. L'effet est subtil lorsque les objets sont observés de près, mais lorsqu'ils sont observés de loin et qu'ils deviennent flous sur les convoyeurs, il permet d'identifier les mouvements des lignes d'objets. L'effet n'est appliqué que sur les objets basiques et intermédiaires les plus communs qui n'ont pas déjà des textures variées.
ir-colour-trains=Si l'option est activé, lorsqu'un train arrive à un arrêt qui possède une icône d'objet ou de fluide dans son nom, et que cette icône a une couleur associée, le train ou sa locomotive sera recoloré. Les fluides, les minerais, les composants basiques et les signaux virtuels colorés sont bien supportés, cependant toutes les icônes n'ont pas de couleur correspondante.
ir-stone-wall-style=Définie si les murs en pierres doivent utiliser les sprites du jeu de base, ou un sprite différent en brique.
# port
ir3patchset-show-short-pipes=Cette option cache les tuyaux souterrains courts des interfaces. Elle ne supprime ni les objets ni les entités construites.
ir3patchset-no-item-colour=C'est un faux objet "panneau interdit" disponible pour les interfaces de filtre.
ir3patchset-new-steam-ratio=Factorio 2.0 possède un ratio 1:10 pour la conversion d'eau en vapeur, donc la quantité d'eau dans les recettes qui transforme de l'eau en vapeur seront divisées par 10.

