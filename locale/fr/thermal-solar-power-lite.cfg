[technology-description]
tspl-thermal-solar-power=Permet de construire un complexe solaire thermique. Particulièrement utile pour l'énergie à vapeur.

[mod-setting-name]
tspl-exchanger-enable-color=Option de couleur de l'échangeur de chaleur de base
tspl-panel-heat-generation-kW=Production de chaleur par panneaux solaires thermiques (kW)
tspl-panel-heat-loss-coefficient=Coefficient de perte du panneau solaire thermique
tspl-exchanger-capacity-kW=Capacité de conversion de l'échangeur de chaleur de base (kW)
tspl-exchanger-temperature-target=Température cible de base de l'échangeur de chaleur (°C)

[mod-setting-description]
tspl-exchanger-enable-color=Donne une belle, [font=default-semibold][color=yellow]peinture jaune[/color][/font] à l'échangeur de chaleur de base. Cela permet de le différencier de l'échangeur de chaleur classique.
tspl-panel-heat-generation-kW=La quantité maximale d'énergie thermique que le panneau solaire thermique produira au cours de la journée (plage : 0-250 kW).\nLe rendement net est nettement inférieur à la température cible de l'échangeur de chaleur de base, en raison des pertes de chaleur !
tspl-panel-heat-loss-coefficient=Coefficient qui détermine la vitesse à laquelle la chaleur accumulée dans les capteurs solaires thermiques est dissipée dans l'environnement.
tspl-exchanger-capacity-kW=La quantité maximale d'énergie convertie dans l'échangeur de chaleur de base. La valeur par défaut de 2100 kW correspond à 70/s de vapeur à 165°C (plage : 1-10000 kW).
tspl-exchanger-temperature-target=Température cible pour la production d'eau chaude ou de vapeur dans l'échangeur de chaleur de base (plage : 15-500°C).

[factoriopedia-description]
tspl-thermal-solar-panel=Il produit de la chaleur à partir de la lumière du soleil et se refroidit lentement la nuit. Lorsque la température atteint un certain seuil, il peut alimenter un échangeur de chaleur pour produire de l'eau chaude ou de la vapeur.
tspl-thermal-solar-panel-large=Version beaucoup plus grande du panneau solaire thermique. Il produit de la chaleur à partir de la lumière du soleil et se refroidit lentement la nuit. Lorsque la température atteint un certain seuil, il peut alimenter un échangeur de chaleur pour produire de l'eau chaude ou de la vapeur.

