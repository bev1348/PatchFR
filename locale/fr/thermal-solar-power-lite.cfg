[entity-description]
tspl-thermal-solar-panel=Produit de la chaleur à partir de la lumière du soleil et se refroidit lentement la nuit.
tspl-thermal-solar-panel-large=Produit de la chaleur à partir de la lumière du soleil et se refroidit lentement la nuit. Version plus grande.
tspl-basic-heat-exchanger-water=Utilise l'énergie thermique pour chauffer de l'eau jusqu'à __1__ °C.
tspl-basic-heat-exchanger-steam=Utilise l'énergie thermique pour transformer l'eau en vapeur à __1__ °C.
tspl-basic-heat-pipe=Une version réduite de la conduite de chaleur.

