[mod-setting-name]
sr_scrap_recycling=Permettre le recyclage de la ferraille
sr_scrap_main_resource=Utiliser la ferraille comme ressource principale

[mod-setting-description]
sr_scrap_recycling=Si activé, l'extraction de ferraille donne un objet "ferraille", qui doit être recyclé/fondu en ses sous-composants.
sr_scrap_main_resource=Si activé, la ferraille utilise la même fréquence et la même densité de placement automatique que le minerai de fer standard (au lieu d'être une ressource secondaire clairsemée) et dispose systématiquement d'un gisement de départ près du lieu où l'on apparaît. Destinée aux cartes où les autres ressources de base (fer, cuivre, charbon, uranium, pétrole brut) sont désactivées.

