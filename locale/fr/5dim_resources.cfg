[technology-description]
5d-vulcanus-resources=Permet le traitement de la poussière de tungstène, de la poussière de calcite et de la lave avec un catalyseur.
5d-fulgora-resources=Débloque la poussière d'holmium, les débris compactés et le recyclage des débris.
5d-gleba-resources=Permet la transformation du Yumako et des noix gélatineuses concentrés.
5d-aquilo-resources=Permet une séparation améliorée des solutions ammoniacales et un traitement optimisé du lithium.
5d-orbit-resources=Débloque les recettes permettant de réduire les astéroïdes en poussière, ainsi que les recettes de base de broyage en orbite qui utilisent cette poussière.
5d-advanced-orbit-resources=Débloque des recettes avancées de broyage en orbite qui nécessitent de la poussière d'astéroïde et dont le coût de traitement est plus élevé.

