[item-description]
pug-mill=Mélange la roche broyée avec de l'eau et la compresse dans des moules à briques. Les briques sortent humides et sèchent d'elles-mêmes.
fermentation-tank=Récipient fermé et refroidi où la biomasse et l'eau fermentent pour former du moût.
island-link-pole=Atteint 64 tuiles, c'est le câble le plus long qui existe, pour acheminer l'électricité d'une île à l'autre. Ne nécessite que deux câbles : un pour l'entrée, un pour la sortie.
fuel-plant=Hydrate le gaz de pétrole pour produire de l’éthanol, puis enrichit l’éthanol en oxygène pour obtenir du carburant de fusée.
distillation-column=Fait bouillir le moût fermenté avec la vapeur provenant du rebouilleur. L’éthanol sort par le haut de la tour et l’eau par le bas.
straw=Herbe coupée et séchée, destinée à être mélangée en adobe.
wet-adobe-brick=Sèche en deux minutes pour former une brique de pierre, quel que soit l’endroit où elle se trouve.
quench-pit=Détruit tout fluide à raison de 1 200 par seconde (l'équivalent d'une pompe). Consomme de l'énergie et pollue fortement lorsqu'elle fonctionne.
air-filter=Un précipitateur électrostatique. Il charge la tour contre l'air qui la traverse vers le haut, et la poussière se dépose. Le compresseur d'air servait auparavant à cela ainsi qu'à la compression et à la séparation. Désormais, il ne fait plus que comprimer et séparer.
gas-combiner=Deux récipients, un tambour de mélange et un ventilateur. Il dose deux gaz ensemble selon un rapport fixe et envoie le mélange.
crystallizer=Un foyer hexagonal contenant un bac de matière en fusion à une température juste inférieure à celle à laquelle la roche se solidifie, avec un agitateur tournant lentement à l’intérieur. Le cristal se forme sur la corniche autour du bord.
silica-crystal=Formé à partir d’une matière en fusion en quelques secondes plutôt que solidifié en une seule seconde. Si on le refond rapidement, il ne peut plus cristalliser : c’est du verre.
glass=Feuille moulée. Le seul matériau transparent de l’île, et celui dont sont revêtus les murs de tous les bâtiments en construction ici.
glazed-panel=Une vitre dans un cadre en acier. Panneau mural pour les serres : l’arboretum, le bassin à algues et le dôme du jardin biologique.
burner-roll-crusher=Deux rouleaux dentés tournant l’un vers l’autre, la roche passant dans l’espace entre eux. Il brûle du combustible, il n’a donc pas besoin de ligne électrique, ce qui est tout l’intérêt car l’île aura besoin de pierre bien avant de disposer d’un réseau électrique.
roll-crusher=Deux rouleaux dentés tournant l’un vers l’autre, la roche passant dans l’espace entre eux. Deux fois plus rapide que le broyeur thermique, et il accepte des modules.
industrial-roll-crusher=Broyeur à rouleaux lourd. Encore plus rapide, quatre emplacements de modules, et une conduite de lubrifiant qui débloque une recette permettant d’obtenir 50 % de pierre en plus à partir du même basalte.
basalt=De la lave solidifiée en roche. Ne vaut rien tant qu’il n’est pas broyé.
basalt-gravel=Le basalte issu du premier passage dans un broyeur. Encore un broyage et c’est de la pierre.
crusher-roll=Un cylindre denté. Un concasseur à cylindres fonctionne grâce à deux de ces cylindres placés face à face.
culture-column=Une colonne vitrée dotée d’un cadre en acier. C’est là que l’on cultive les algues, et le réservoir en comporte quatre.
grow-lamp=Un tube magenta sous un réflecteur. Les plantes et les algues poussent sous ces lampes, car il n’y a pas de soleil digne de ce nom ici.
condenser-coil=Un tube de cuivre à ailettes. Il extrait la chaleur de la vapeur afin que celle-ci se recondense en eau.
bio-garden=Un dôme de verre recouvrant un épaississeur et une presse. Il extrait de la récolte d’algues ce qui a servi à leur croissance (fibres, azote ou carbonate) et absorbe la pollution pendant son fonctionnement, à peu près autant que dix-sept arbres sur une île qui n’en compte aucun.
algae-tank=Un photobioréacteur hermétique. Quatre colonnes de culture derrière une vitre, où poussent des algues vertes, bleues ou rouges selon ce que l'on introduit dans le deuxième tuyau.
algae-green=Cultivées dans une eau riche en minéraux dissous. Produisent des fibres qui, une fois pressées, donnent du bois utilisable.
algae-blue=Cultivées dans l'eau et l'air. Fixent l'azote directement à partir de l'atmosphère.
algae-red=Cultivées dans de l’eau et de la vapeur. Déposent du carbonate de calcium au fur et à mesure de leur croissance.
arboretum=Une serre de 5x5 équipée de lampes de culture et d’une rampe d’irrigation rotative. Fait pousser du bois à partir de graines d’arbres et d’eau, et peut produire ses propres graines à partir du bois.
water-condenser=Condenseur de vapeur refroidi à l’air. Transforme la vapeur en eau avec un rapport de 2 pour 1, alors qu’une usine chimique n’y parvient qu’à hauteur d’à peine un dixième de ce rendement.
industrialised-chemical-plant=Une raffinerie complète sur un châssis de 3x3. Vitesse de fabrication deux fois supérieure à celle d’une usine chimique, avec les mêmes recettes chimiques. Ses hublots indiquent la couleur de ce qu’elle est en train de fabriquer.
uranium-bacteria=Bactérie qui métabolise le bioflux en minerai d'uranium. Pourrit en minerai d'uranium.
lava-mech-armor=Une armure Mécha de base offrant une protection minimale. Idéale pour survivre dans un environnement hostile recouvert de lave.
xp-science-pack=Expérience cristallisée issue de la fabrication. Utilisée dans le laboratoire d'expérience.
xp-lab=Un laboratoire spécialisé qui n'accepte que les packs de science d'expérience pour la recherche de quêtes.
military-science-pack-2=Pack de science militaire avancée utilisant des armes de pointe et des technologies électromagnétiques.
circuit-science-pack=Pack de science axé sur la recherche en matière de circuits électroniques et l'amélioration de la productivité.
lava-slag=Les scories écumées à la surface de la lave en fusion. Cultivées avec du soufre et du charbon, elles produisent des cristaux. Lessivées à l’eau, elles libèrent leur calcium.
pyrite=Sulfure de fer, qui se forme en cubes. Le cristal le plus courant produit par le foyer.
magnetite=Oxyde de fer, issu de fer en fusion mélangé à des scories. Magnétique, il retient la matière en fusion dans les cellules de magma et dans le réacteur à magma, et fait tourner le générateur de la turbine à magma.
olivine=Le silicate vert dont est composée la majeure partie des scories. Elle résiste à la chaleur sans fondre, c'est pourquoi elle sert de revêtement au réacteur à magma et aux cellules de magma. Broyez l’excédent pour en faire du gravier.
ruby=Corindon rougi par le chrome. Une fabrication sur cinq en produit un.
sapphire= Corindon coloré par le fer et le titane. Une fabrication sur cinq en produit un.
diamond=Carbone issu du charbon. Une fabrication sur vingt en produit un. La découpeuse laser en utilise un pour évacuer la chaleur de sa tige de rubis.
crystal-circuit-board=Circuit déposé sur du saphir, avec des contacts en pyrite et un rubis en son centre. Il alimente la découpeuse laser et supporte l’unité de traitement au saphir.
limestone=Fabriqué, non extrait : du calcium issu des scories, fixé par le dioxyde de carbone.
quicklime=Calcaire cuit jusqu’à ce que son dioxyde de carbone ait disparu. Ajoutez de l’eau.
slaked-lime=Chaux vive après ajout d’eau, réduite en poudre. Liant du mortier de chaux.
lime-mortar=Chaux éteinte et gravier, mélangés dans le mélangeur. Coulé pour former du béton.
quartz-lens=Moulée à partir de quartz fondu. Le quartz fondu laisse passer la lumière du laser sans l’absorber ni se fissurer, ce que le verre ne fait pas.
silicon-wafer=Tranche prélevée sur un cristal de silice. Les cellules solaires sont fabriquées à partir de celles-ci.
sapphire-substrate=Saphir découpé en fines plaques, destiné aux puces montées sur cristal plutôt que sur du silicium seul.
magma-cell=Une bobine de magnétite contenant une charge de matière en fusion dans un revêtement d’olivine, avec de la pyrite pour l’allumer. Combustible du réacteur à magma : 40 GJ, quarante secondes dans un réacteur en fonctionnement.
magma-reactor=Brûle des cellules de magma et aspire 100 MW pour propulser du sel fondu froid vers le plasma – soit 1 000 MW, suffisamment pour quatre turbines à magma, une sur chaque buse à plasma. Les réacteurs construits côte à côte fonctionnent à des températures plus élevées.
magma-turbine=Quinze tuiles de turbine et de générateur. Transforme le plasma de magma en 250 MW et en sel fondu chaud, qui doit être refroidi avant d’être réinjecté dans le réacteur. Le plasma ne passe que directement depuis un réacteur ou une autre turbine, jamais par un tuyau.

