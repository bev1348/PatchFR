[recipe-description]
adobe-bricks-reinforced=Les fibres présentes dans le mélange maintiennent le bloc en place pendant qu’il sèche, ce qui permet d’en conserver une plus grande partie.
quench-fluid=Vide le fluide dans la lave sous l’île. Rien n’en ressort.
crystal-growing=Chaque cristal se forme de manière aléatoire : pyrite et olivine une fois sur deux, rubis et saphir une fois sur cinq, diamant une fois sur vingt.
lime-concrete=Béton lié à la chaux : 15 au lieu des 10 de la recette du jeu de base, et pas de minerai de fer ni de brique.
salt-melting=Remplit une boucle de magma. Le réacteur et la turbine se transmettent mutuellement le même sel. Ce remplissage n'est donc nécessaire que lorsqu'une partie de celui-ci a été perdue.


