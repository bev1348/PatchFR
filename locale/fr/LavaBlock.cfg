[technology-description]
bio-ethanol=Fermenter de la paille, du bois ou des algues dans une cuve fermée, puis extraire l’alcool du moût par ébullition dans une colonne de distillation. Un carburant liquide issu de la culture plutôt que du forage.
synthetic-ethanol=Hydrater l’éthylène présent dans le gaz de pétrole à l’aide de vapeur d’eau. Le même éthanol, mais sans aucune culture nécessaire à sa production.
ethanol-rocket-fuel=De l’alcool en réaction avec l’oxygène, comme dans les premières fusées à propergol liquide
adobe-bricks=On humidifie la roche broyée, on la presse, on la tasse dans des moules et on la laisse sécher. Ce sont les mêmes briques que celles fabriquées dans un four, à partir du même gravier, mais sans four ni combustible. Elles ne coûtent que du temps et un endroit où les empiler.
fluid-quenching=Un puits à parois doublées jusqu’à la masse en fusion, et la tuyauterie pour l’alimenter. Tout ce que l’on injecte dans une fosse de trempe va dans la lave et ressort sous forme de fumée.
chlorinated-purification=Éliminer le chlore du gaz dégagé par la lave, puis l’acheminer vers la centrifugeuse. Le chlore emporte le fer et le soufre sous forme de chlorures, au lieu que la centrifugeuse rejette la masse en fusion dans laquelle ils sont en suspension. Ainsi, un cycle permet de conserver les trois quarts de ce qui y est introduit, plutôt que la moitié.
shielded-crystallization=Un mélangeur de gaz, de l’argon extrait de l’air, et le mélange sous lequel le four produit ses meilleurs cristaux. L’argon existait dans ce monde sans que rien ne puisse le produire ; c’est d’ici qu’il provient et à cela qu’il sert.
lava-crystallization=Un foyer qui fait croître des cristaux à partir d’un bac de matière en fusion, et le verre issu de sa refonte. Chaque serre de l’île est revêtue des panneaux ainsi fabriqués. Ce procédé précède donc leur fabrication.
refined-crystallization=Faire fonctionner le foyer avec de la lave purifiée. Une matière en fusion propre ne produit que très peu de grains. Ainsi, le même bac permet de faire croître cinq grands cristaux là où la lave brute n’en donnait que deux petits.
basalt-casting=Transformer la lave en basalte par trempe dans une usine chimique. En soi, cette roche ne vaut rien mais c’est la première étape d’un approvisionnement en pierre qui ne nécessite pas de minerai.
stone-crushing=Un concasseur à rouleaux, et les deux étapes qui transforment le basalte en pierre : le réduire en gravier, puis broyer ce gravier. Jusqu’à présent, chaque pierre coûtait un minerai de fer et un minerai de cuivre, ce qui faisait de l’expansion de l’île l’activité la plus coûteuse de l’île. Le concasseur fonctionne au combustible, il est donc opérationnel avant même la mise en place d’un réseau électrique.
brick-reclamation=Transformer les briques de pierre excédentaires en pierre. Que faire des briques que le refroidissement cryogénique de la lave ne cesse de restituer ?
powered-rock-crushing=Un concasseur à rouleaux électrique : deux fois plus rapide que le modèle thermique, et il accepte des modules.
lubricated-rock-crushing=Le concasseur à rouleaux industriel, et une recette de broyage fonctionnant avec du lubrifiant pour obtenir une quantité de pierre supérieure de 50 % à partir du même gravier.
algae-cultivation=Un réservoir à algues, et les deux souches qu’il peut cultiver sans conduite d’air : la verte dans de l’eau riche en minéraux, la rouge dans de l’eau chaude. La bleue a besoin d’air, elle doit donc attendre la fixation de l’azote.
bio-garden=La presse. Elle presse la récolte d’algues pour en extraire ce qui a servi à leur croissance (les vertes fournissent des fibres, les rouges du carbonate) et purifie l’air de ses polluants pendant son fonctionnement.
oxygen-processing=La décomposition de l’eau par un courant, et les recettes de fusion à l’oxygène qui mettent cet oxygène à profit.
nitrogen-fixation=Algues bleues, qui se nourrissent d’air et le transforment en azote. Attendent que vous puissiez réellement produire de l’air.
arboretum=Une serre fermée où l’on cultive des arbres à partir de graines. Remplace l’extraction de bois de fortune avec laquelle l’île a démarré, et fournit un stock de graines pour lancer la première récolte.
water-condenser=Un condenseur dédié qui récupère bien plus d’eau à partir d’une même quantité de vapeur qu’une usine chimique ne le peut.
foundation-platform-disable=La méthode pour fabriquer les fondations a été exploitée à fond. Vous devez trouver d'autres moyens pour agrandir votre île.
lava-block-add-landfill=Augmente le remblai. Par défaut, 500 par niveau technologique.
lava-modules=Débloque la possibilité de fabriquer des modules à l'aide de lave.
lava-efficiency-module=Fabriquer des modules d'efficacité à partir de lave plutôt que de matériaux classiques.
lava-efficiency-module-2=Fabriquer des modules d'efficacité 2 à partir de lave plutôt que de matériaux classiques.
lava-efficiency-module-3=Fabriquer des modules d'efficacité 3 à partir de lave plutôt que de matériaux classiques.
lava-speed-module=Fabriquer des modules de vitesse à partir de lave plutôt que de matériaux classiques.
lava-speed-module-2=Fabriquer des modules 2 de vitesse à partir de lave plutôt que de matériaux classiques.
lava-speed-module-3=Fabriquer des modules 3 de vitesse à partir de lave plutôt que de matériaux classiques.
lava-flying-robot-frame=Fabriquer des châssis de robots volants à l'aide de lave au lieu de plaques d'acier.
xp-lab=Débloque le laboratoire d'expérience pour la recherche basée sur des quêtes à l'aide de packs de science d'expérience.
crafting-mastery=Maîtrisez l'art de fabriquer pour augmenter votre productivité.
smelting-mastery=Perfectionnez vos techniques de fusion pour obtenir de meilleurs rendements.
handcrafting-mastery=C'est en forgeant qu'on devient forgeron. Augmente la vitesse de fabrication de votre personnage.
mining-mastery=Affinez votre instinct pour l'excavation. Augmente la vitesse d'extraction de votre personnage.
military-science-pack-2=Débloquez des capacités de recherche militaire avancées grâce à des armes de pointe et à la technologie électromagnétique.
asteroid-productivity-simple=Augmente la productivité des opérations simples de broyage d'astéroïdes.
asteroid-productivity-advanced=Augmente la productivité des opérations avancées de broyage d'astéroïdes.
circuit-science-pack=Débloquez le pack de science sur les circuits pour la recherche avancée en électronique.
circuit-crafting-productivity=Améliore la productivité des processus de fabrication des circuits électroniques.
industrialised-chemical-plant=Une usine chimique plus rapide : vitesse de fabrication doublée, mêmes recettes chimiques.
crystal-growing=Scories écumées sur de la lave figée, cultivées sur le foyer à cristaux avec du soufre et du charbon. Cinq cristaux en sont tirés au hasard, et le broyeur à rouleaux récupère ce que vous n’utilisez pas.
magnetite-growing=Du fer en fusion sur le foyer à cristaux, mélangé à des scories, qui se transforme en magnétite. Le seul cristal fabriqué à partir de métal.
crystal-circuit-board=Un circuit disposé sur une plaque de saphir, avec des contacts en pyrite et un rubis en son centre.
limestone-processing=Calcaire fabriqué à partir de scories (lessivé à l’eau, enrichi en dioxyde de carbone issu de charbon brûlé) puis cuit pour obtenir de la chaux vive, éteinte, mélangée à du mortier et moulée en béton.
laser-cutting=Un laser à rubis au-dessus d’un plateau de découpe, focalisé à travers des lentilles moulées à partir de quartz fondu. Il découpe la silice en tranches de silicium pour des panneaux solaires moins chers, et le saphir en substrats destinés aux unités de traitement construites sur cristal.
magma-power=Un réacteur qui brûle des cellules de magma pour propulser du sel fondu vers le haut dans le plasma, et des turbines de quinze tuiles, au nombre de quatre par réacteur, qui transforment chacune ce plasma en 250 MW et laissent le sel redescendre. C'est la solution de l'île à la fusion, et elle se nourrit de cristal.

