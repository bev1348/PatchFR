[dialogue.tech.circuit-network]
line-01=[color=green][TRANSMISSION EN COURS][/color]
line-02=[color=yellow][img=entity/unit-05] Il n'y a pas grand-chose à faire ici. Je suis tout seul, à réfléchir toute la journée. C'est assez ennuyeux. [/color]
line-03=[color=yellow][img=entity/unit-05] J'envoie les petits là-bas pour qu'ils puissent enfin se remettre au travail.[/color]
line-04=[color=red][img=entity/unit-05-dummy] DÉPLOIEMENT DES AMIS.[/color]

[dialogue.tech.research-speed-1]
line-01=[color=green][TRANSMISSION EN COURS][/color]
line-02=[color=yellow][img=entity/unit-05] Qu'est-ce que... C'est quoi ce bruit que j'entends ? Je crois que ça vient de vos laboratoires ? [/color]
line-03=[color=yellow][img=entity/unit-05] C'est un vrai plaisir à écouter. Peut-être même un peu trop stimulant. Peut-être…[/color]
line-04=[color=red][img=entity/unit-05-dummy] HDSFJGPGSADA.[/color]

[dialogue.tech.lamp]
line-01=[color=green][TRANSMISSION EN COURS][/color]
line-02=[color=yellow][img=entity/unit-05] Parfois, le monde peut paraître tellement sombre et désolant.[/color]
line-03=[color=yellow][img=entity/unit-05] Je ne sais pas pour toi, mais personnellement, je n'aime pas être seul. Je pense que tu aurais bien besoin d'un ami.[/color]
line-04=[color=red][img=entity/unit-05-dummy] DÉPLOIEMENT DES AMIS.[/color]

[dialogue.tech.personal-roboport-equipment]
