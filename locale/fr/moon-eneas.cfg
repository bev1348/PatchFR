[technology-description]
discover-artifact=Bien que leur véritable fonction reste inconnue, les [item=eneas-artifact] artéfacts disséminés sur Nauvis peuvent être démontés pour en tirer des ressources utiles.
artifact-analysis-basic=Les [item=eneas-artifact] artéfacts peuvent servir à améliorer des bâtiments de base. Pour améliorer des structures plus complexes, il faudra d'abord remettre à neuf ces artéfacts.
artifact-analysis-advanced=Permet d'améliorer les artefacts pour les faire passer à des niveaux supérieurs. Cela leur permet d'améliorer une plus grande variété de bâtiments et d'en augmenter la qualité.
artifact-analysis-expert=Permet d'améliorer les artefacts pour les faire passer à des niveaux supérieurs. Cela leur permet d'améliorer une plus grande variété de bâtiments et d'en augmenter la qualité.
artifact-analysis-master=Permet d'améliorer les artefacts pour les faire passer à des niveaux supérieurs. Cela leur permet d'améliorer une plus grande variété de bâtiments et d'en augmenter la qualité.
artifact-analysis-grandmaster=(Travail en cours) C'est ici que s'achève la première partie d'Énéas. Aquilo et la fin de la partie seront abordés dans la deuxième partie d'Énéas.
ancient-core-tech=Extrayez le [item=ancient-core] des artéfacts, qui contient des données essentielles pouvant servir de combustible à des bâtiments plus avancés.
basic-data-management=L'utilisation de données anciennes [ancient-core] permet à la fois d'alimenter en énergie des bâtiments plus complexes et d'améliorer les aspects de l'usine liés à la science et au renseignement.
planet-discovery-eneas=Une petite lune sans prétention, dont le climat est similaire à celui de Nauvis. Un examen plus approfondi révèle que c'est de là que proviennent les transmissions que vous recevez
artifact-drilling=Sur Énéas, les artefacts peuvent être extraits directement du sous-sol.
ambition-science-pack=Souvenirs d'ambition
fear-science-pack=Souvenirs de peur
anger-science-pack=Souvenirs de colère
grief-science-pack=Souvenirs de chagrin
lesser-ai=Une intelligence artificielle très rudimentaire capable d'aider [entity=unit-05] Unité 05 à exploiter ses [item=ambition-science-pack] packs de mémoire.
advanced-radar=Radar avancé doté d'un rayon de vision permanent nettement plus large. Sur Nauvis, ces radars attireront vers eux les [entity=debris-a] débris. La construction de plusieurs radars augmente la probabilité d'obtenir des débris supplémentaires, avec des rendements décroissants.\n\n Le radar peut également émettre des ordres de déconstruction automatiques en recevant des signaux provenant du réseau logique. Pour plus d'informations, consultez la page Informatron correspondante.
module-tech=Grâce à l'utilisation de composants d'artéfacts, les modules peuvent être améliorés pour atteindre un niveau de qualité supérieur plus rapidement que d'habitude
module-tech-2=Grâce à ces anciens noyaux, les modules avancés peuvent être améliorés pour atteindre un niveau de qualité supérieur plus rapidement que d'habitude
engineer-assembler=Une ligne d'assemblage avancée inspirée de la technologie de l'ingénieur. Elle bénéficie d'un bonus intrinsèque de productivité. Elle ne nécessite aucune alimentation électrique, mais doit être alimentée en flux continu de données pour fonctionner.
engineer-roboport=Une version améliorée du Roboport, capable d'alimenter une zone plus étendue avec la même puissance.
tinker-tech-basic=Grâce à des artéfacts améliorés, vous pouvez créer des objets d'approvisionnement de différentes manières.
tinker-tech-advanced=Grâce à des artéfacts améliorés, vous pouvez créer des objets d'approvisionnement de différentes manières.
lurker-tech=Il semblerait qu'il y ait quelque chose qui se cache dans les eaux boueuses d'Énéas...
supply-tech=Permet à [entity=unit-05] Unité 05 de produire davantage de ressources par cycle sur Énéas. Améliore également la qualité des [item=eneas-artifact] artéfacts fournis.
codex-tech=Permet à [entity=unit-05] Unité 05 de produire des [item=notable-codex] Codex de référence, avec un rendement plus élevé lorsque la pollution est faible. Les objets seront livrés à chaque cycle à [entity=eneas-lift] l'ascenseur de ressources. \n\nCes données constituent une source de carburant plus efficace que les [item=significant-data-card] cartes de données importantes.
oil-tech=Permet à [entity=unit-05] Unité 05 de produire des [item=heavy-oil-barrel] barils de pétrole, avec un rendement plus élevé lorsque le niveau de pollution est faible. Les ressources seront livrées à chaque cycle à [entity=eneas-lift] l'ascenseur de ressources
gantry-tech=Le [entity=gantry] portique permet d'améliorer les entités qui y sont stationnées. 

