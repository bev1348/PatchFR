[item-description]
eneas-artifact=Vestiges anciens de la technologie des Ingénieurs. Ils peuvent être soit mis au rebut pour en récupérer les pièces utiles, soit utilisés comme composants pour la fabrication de machines avancées.
ancient-core=Le cœur battant des machines des Ingénieurs.
volatile-nutrients=[color=yellow][img=entity/unit-05] Nutriments puissants qui concentrent beaucoup d'énergie dans un espace réduit. Instables.[/color]
volatile-spoilage=[color=red][img=entity/unit-05-dummy] Des nutriments instables et pourris, sur le point d'EXPLOSER violemment.[/color]
ambition-science-pack=Aidez Unité 05 à reconstituer ses souvenirs
anger-science-pack=Aidez Unité 05 à reconstituer ses souvenirs
fear-science-pack=Aidez Unité 05 à reconstituer ses souvenirs
grief-science-pack=Aidez Unité 05 à reconstituer ses souvenirs
rpg_small_xp_potion=Consommez ceci pour acquérir un peu de connaissances.
servofish=Système originaire d'Énéa. Conçu pour filtrer et assainir les lacs et les réseaux d'égouts, mais il a été submergé par la pollution il y a longtemps. [color=red]Non comestible.[/color]
rotund-friend=[color=yellow][entity=unit-05] Ils sont trop mignons. J'adore le petit bruit qu'ils font quand ils virevoltent. J'ai utilisé ton modèle, mais je les ai rendus un peu plus performants. Prends bien soin d'eux ![/color]
Construction_Drone=[color=yellow][entity=unit-05] Ces petits bonhommes me tiennent compagnie depuis aussi longtemps que je me souvienne. Je doute que je serais encore là sans eux. J'espère qu'ils t'apporteront autant de joie qu'ils m'en apportent ! [/color]

