[entity-description]
debris-a=Un grand débris extraterrestre provenant de l'une des lunes de Nauvis. Contient des traces d'une technologie ancienne. A une probabilité élevée de donner des objets [color=yellow]encore plus précieux[/color] lorsqu'il est extrait à la main.
debris-b=Un débris moyen extraterrestre provenant de l'une des lunes de Nauvis. Contient des traces d'une technologie ancienne. A une probabilité élevée de donner des objets [color=yellow]encore plus précieux[/color] lorsqu'il est extrait à la main.
debris-c=Un petit débris extraterrestre provenant de l'une des lunes de Nauvis. Contient des traces d'une technologie ancienne. A une probabilité élevée de donner des objets [color=yellow]encore plus précieux[/color] lorsqu'il est extrait à la main.
eneas-vent=Il y a des quantités quasi infinies de déchets et de pollution piégées sous la surface d'Énéas [planet=eneas]. De temps à autre, cette cheminée émet des fumées toxiques qui perturbent Unité 05.\n\n Bloquer ou détruire la cheminée ne sert à rien, car les gaz trouveront toujours un moyen de remonter à la surface.
auto-deconstruct-radar=Radar avancé doté d'un rayon de vision permanent nettement plus large. Sur Nauvis, ces radars attireront vers eux les [entity=debris-a] debris. La construction de plusieurs radars augmente la probabilité d'obtenir davantage de débris, mais avec des rendements décroissants.\n\n Le radar peut également émettre des ordres de déconstruction automatiques en recevant des signaux provenant du réseau logique. Pour plus d'informations, consultez la page Informatron correspondante.
eneas-lift=Transporte les ressources depuis les installations de fabrication souterraines d'Énéas jusqu'à la surface. La quantité produite par cycle dépend du niveau de pollution local sur Énéas.\n\nLe rendement peut être encore amélioré en menant des recherches sur les technologies [entity=eneas-lift] liées à l'ascenseur.\n\n [color=red][img=entity/unit-05-dummy] ATTENTION : TOUT OBJET LAISSÉ DANS L'ASCENSEUR SERA JETÉ DÈS LA PROCHAINE LIVRAISON [/color]
eneas-generator=Les bâtiments conçus selon cette ancienne technologie sont construits pour s'alimenter eux-mêmes, rendant ainsi superflues les grandes centrales électriques.\n\n[entity=unit-05] Unité 05 a mis au point cette interface énergétique rudimentaire en prévision de votre arrivée.
unit-05=Le cortex principal de [entity=unit-05] Unité 05. Consomme des [item=ambition-science-pack] packs de mémoire pour restaurer les entrées de mémoire perdues.\nDoit être alimenté par une [item=significant-data-card] source de carburant de données.
rotund-friend=[color=yellow][entity=unit-05] Ils sont trop mignons. J'adore le petit bruit qu'ils font quand ils virevoltent. J'ai utilisé ton modèle, mais je les ai rendus un peu plus performants. Prends bien soin d'eux ![/color]
gantry=Le [entity=gantry] portique permet d'améliorer les entités qui y sont stationnées.\n\n Pour améliorer une entité, ouvrez d'abord l'inventaire de fabrication du portique et sélectionnez une qualité cible. Cette qualité doit être supérieure d'un niveau à celle du véhicule que vous souhaitez améliorer (par exemple, sélectionnez la recette <Inhabituel> pour améliorer une locomotive normale et passer de la qualité normale à la qualité inhabituelle).\n\n Fournissez ensuite au portique les ingrédients nécessaires. Si vous déplacez le véhicule pendant le processus d'amélioration, vous risquez de gaspiller des ingrédients.

