page_eneas_text_1=Énéas
page_eneas_text_2=Nom donné à une station spatiale mobile créée par le peuple de [planet=fulgora] Fulgora. Énéas abrite non seulement [entity=unit-05] Unité 05, une intelligence artificielle installée pour assurer la gestion de la station, mais dispose également d'outils <censuré> à la pointe de la technologie, d'un système d'armement orbital et interplanétaire ainsi que d'une forge intégrée. En raison de négligences, la plupart de ces fonctionnalités sont actuellement indisponibles ou soumises à des restrictions. La surface d’Eneas était autrefois utilisée pour - \n\n [color=yellow][entity=unit-05] - était tout à fait banale et ennuyeuse. Et des armes ? Quelles armes ? Je n’ai aucune arme.[/color]\n\n [color=red][entity=unit-05-dummy] VÉRIFICATION DE L'ÉTAT - - - MARS = EN LIGNE - - - NERIO = EN COURS DE RÉCUPÉRATION. [/color]
page_eneas_text_3=Origines
page_eneas_text_4=Construit en orbite autour de [planet=fulgora] Fulgora, est capable d'effectuer des voyages interplanétaires à une vitesse inférieure à celle de la lumière ; il est généralement en orbite autour des planètes actuellement <censuré>.
page_unit_text_1=Unité 05
page_unit_text_2=Personnalité artificielle extrêmement avancée qui brouille la frontière entre la machine et l'être vivant. [entity=unit-05] Unité 05 est intégrée au cœur d'Énéas [planet=eneas], la station spatiale tout entière ayant été conçue pour l'accueillir. Alimentée par un moteur à antimatière de la taille d'une lune, Unité 05 dispose de réserves d'énergie quasi illimitées, dont les applications sont toutefois restreintes en raison de la détérioration avancée de son équipement. \n\n [color=yellow][entity=unit-05] Waouh, cet Informatron que je t'ai donné a vraiment un niveau d'accès très élevé. Tu ne devrais pas laisser un peu plus de place à l'imagination ?[/color]
page_unit_text_3=\nHistorique
page_unit_text_4=Conçu et construit à l'origine sur la [planet=Fulgora] planète Fulgora, et son cré- [color=red][entity=unit-05-dummy] ÇA SUFFIT.[/color]\n\n [color=yellow][entity=unit-05] Un peu d'intimité, s'il vous plaît. Allez, ce n’est pas comme si je fouillais sans arrêt dans ton dossier. En parlant de ton dossier, où est-ce que je l’ai rangé déjà ? Il était juste là…[/color]
page_pollution_text_1=Pollution
page_pollution_text_2=À chaque cycle (15 minutes), une quantité variable de pollution sera [entity=eneas-vent] rejetée depuis les vastes souterrains d'Énéas vers la surface. Il y a longtemps, Énéas était capable de s'autogérer, mais cette époque est révolue. Vous pouvez éliminer la pollution sur Énéas à l'aide de certains des nouveaux bâtiments. Par exemple, le [entity=clarifier] Clarificateur.\n\nLes vérifications de la pollution ont lieu avant que de nouvelles émissions ne soient ajoutées lors du cycle suivant. Si le niveau de pollution est trop élevé, [entity=unit-05] Unité 05 sera désactivé pour le reste du cycle. La réduction de la pollution permettra à Unité 05 de fonctionner à nouveau.\n\n La pollution est vérifiée par blocs autour de ces entités : \n\n[entity=unit-05] Unité 05 \n\n[entity=eneas-vent] Évents à pollution \n\n[entity=artifact-extractor] Extracteurs d'artéfacts
page_pollution_text_3=\nÉvents
page_pollution_text_4=Les évents ne sont en réalité qu'un exutoire pour la pollution. Si vous parveniez d'une manière ou d'une autre à les détruire ([color=yellow][entity=unit-05] si tu y arrives, dis-moi comment tu as fait ! [/color]), la pollution se diffusera alors de manière aléatoire à différents endroits de la carte.
page_generator_text_1=Générateur
page_generator_text_2=Bien que ce bâtiment ait l'air ancien, il semblerait qu'il ait été construit par [entity=unit-05] il y a relativement peu de temps. Il fournit un approvisionnement constant en électricité afin de s'adapter à votre style de construction plus rudimentaire.
page_generator_text_3=\nL'énergie sur Énéas
page_generator_text_4=[color=yellow][entity=unit-05] Sur Énéas, on ne trouve pas de prises électriques un peu partout. Le problème de l’alimentation électrique, on l’a résolu il y a bien longtemps : tout ce qui fonctionne avec la technologie d’origine de Fulgora est capable de s’alimenter à partir de ses propres noyaux. Voilà, c’est un petit coup de pouce pour bien démarrer.[/color]
page_lift_text_1=Ascenseur
page_lift_text_2=L'[entity=eneas-lift] ascenseur est l'un des derniers points d'accès restants aux installations de fabrication situées dans les entrailles d'Énéas. En utilisant cet ascenseur, [entity=unit-05] Unité 05 peut vous fournir des ressources à chaque cycle sur Énéas (15 minutes). Par défaut, cela produit des artéfacts et du remblai.
page_lift_text_3=\nRendement
page_lift_text_4=Vous pouvez augmenter le rendement de ces livraisons de deux manières : tout d'abord, en réduisant les niveaux de pollution sur Énéas. Lorsque la surface est propre, Unité 05 est plus performante et peut produire davantage de ressources pour vous. Ensuite, vous pouvez mener des recherches sur de nouvelles technologies afin d'augmenter la quantité totale de ressources générées et d'ajouter de nouveaux objets à la réserve.
page_unit_07_text_1=Unité 07
page_unit_07_text_2=Le 7e Agent a été construit dans l'exercice de ses fonctions par <censuré> et <CENSURÉ>. D'une envergure plus modeste que ses prédécesseurs, les numéros 5 et 6, le 7e est équipé des moyens nécessaires pour franchir les terrains les plus difficiles et mener à bien des missions de reconnaissance sur les planètes.
page_unit_07_text_3=\nSpidertron
page_unit_07_text_4=\n[color=yellow][entity=unit-05] Ce modèle <spidertron> que tu as dans ta bibliothèque s'inspire clairement du numéro 07. Mais où l'as-tu trouvé ? Je ne me souviens pas t'avoir transmis ce plan.[/color]
page_artifact_text_1=Artéfacts érodés
page_artifact_text_2=Des vestiges de technologies anciennes. Même dans leur état délabré, les [item=eneas-artifact] artéfacts renferment encore des éléments technologiques avancés qui peuvent servir à améliorer et à moderniser vos outils et vos bâtiments. Ils peuvent être récupérés dans les [entity=debris-a] ou extraits directement des chambres aux artefacts à l'aide d'un [entity=artifact-extractor] Extracteur d'artéfacts.
page_artifact_text_3=\nMise à niveau des artéfacts
page_artifact_text_4=Afin d'exploiter pleinement la puissance des [item=eneas-artifact] artéfacts, ceux-ci doivent d'abord être remis à neuf. Pour ce faire, il faut améliorer leur qualité à l'aide d'ingrédients de plus en plus complexes. Les kits d'outils sont indispensables à ce processus, car les mécanismes standard de vos machines d'assemblage ne sont pas suffisamment adaptés pour traiter seuls ces pièces historiques délicates.
page_artifact_text_5=Utilisation d'artéfacts
page_artifact_text_6=[item=eneas-artifact] Les artéfacts peuvent être utilisés de différentes manières. Associez un artéfact à une machine de fabrication pour améliorer son niveau de qualité. Les machines simples peuvent être améliorées plus facilement : même un artéfact de qualité normale suffira à les améliorer.\n\n Pour les bâtiments plus complexes, l'artéfact devra être de la même qualité que celle visée.
page_debris_text_1=Chute de débris
page_debris_text_2=Il semblerait que la lune [planet=eneas] située au-dessus de Nauvis soit instable et perde constamment de la matière, qui s'écrase à la surface de sa voisine [planet=nauvis]. Les deux corps célestes semblent être en rotation synchrone, ce qui concentre les impacts dans une zone bien délimitée.\n
page_debris_text_3=[color=yellow][entity=unit-05] Les marqueurs cartographiques des débris peuvent être gênants. Mais ne t'inquiètes pas ! Ils seront automatiquement supprimés toutes les 15 minutes, à condition qu'il n'y ait pas de débris à proximité. [/color]
page_debris_text_4=\nTrésor
page_debris_text_5=Si les pièces d'[item=eneas-artifact] anciennes machines que l'on peut récupérer dans les débris semblent déjà précieuses, il existe des butins encore plus utiles cachés parmi celles-ci.\nPour les découvrir, il faut faire preuve d'une certaine habileté et d'une précision que seul l'ingénieur est capable de réunir. L'exploitation automatique des débris à l'aide de [item=construction-robot] robots ne permettra d'obtenir que les ressources de base, sans aucune chance de trouver un butin rare.\n
page_data_text_1=Données
page_data_text_2=En extrayant avec soin les parties les plus délicates des [item=eneas-artifact] artéfacts anciens, vous pouvez en extraire leurs [item=ancient-core] noyaux.\n\n[color=yellow][entity=unit-05] La plupart de mes créations sont autonomes en énergie ; elles n'ont besoin que des instructions de la source pour fonctionner. À l'époque, chaque partie d'Énéas était reliée à moi, ce qui ne semblait pas être un inconvénient majeur, mais aujourd'hui, mes racines s'étendent à peine au-delà de mon cortex.[/color]\n\n
page_data_text_3=\nDonnées
page_data_text_4=[color=yellow][entity=unit-05] Ces noyaux contiennent une version bien plus simple du code qui me fait fonctionner. Ils peuvent alimenter pendant un certain temps les bâtiments qui dépendent de ces données, mais ce n'est pas une solution idéale, d'autant plus que ces noyaux sont très détériorés. Si tu pouvais transcrire leur contenu dans des supports de données fonctionnels, tu pourrais prolonger leur durée de vie.[/color]\n\n
page_radar_text_1=Radar
page_radar_text_2=Ce radar de pointe est capable d'automatiser la déconstruction des entités. Sur la [planet=nauvis] planète Nauvis, le radar permettra à [entity=unit-05] Unité 05 de guider les [entity=debris-a] débris qui s'écrasent à proximité afin de faciliter leur récupération. L'ajout de radars supplémentaires augmentera la quantité de débris que [entity=unit-05] Unité 05 pourra vous envoyer, mais avec des rendements décroissants. Afin de laisser suffisamment d'espace pour que les [entity=debris-a] débris s'écrasent, ceux-ci doivent être espacés d'au moins 64 tuiles.
page_radar_text_3=Mode d'emploi
page_radar_text_4=Définissez le type d'entité que le radar doit cibler pour la démolition. Sur l'illustration, tous les types de débris sont sélectionnés, mais le radar peut également démolir des bâtiments classiques.\n\n[item=servofish] peut être saisi pour ordonner aux robots d'extraire les servo-poissons directement de l'eau. \n\n[virtual-signal=signal-mining] peut être utilisé pour ordonner au radar de cibler tous les objets au sol.\n\n Par défaut, la portée du radar est de 64. Vous pouvez l'augmenter jusqu'à 256 tuiles en transmettant un certain nombre de signaux [virtual-signal=signal-R] R au radar. Dans l'exemple, la portée est réglée sur 256.\n\n ([color=red][entity=unit-05-dummy] En raison des limitations de mon code, les radars partagent leurs entrées logiques entre eux. Ainsi, les cibles de démolition sont définies à l'échelle de la surface pour tous les radars, et il suffit d'envoyer des instructions à un seul d'entre eux. [/color])
page_fish_text_1=Servo-poisson
page_fish_text_2=Au fond des mares d'eau stagnante présentes sur Eneas, errent les Servo-poissons, des engins d'origine ancienne autrefois destinés à maintenir l'équilibre fragile de l'écosystème artificiel de la station. Faute d'une surveillance et d'un entretien adéquats, les servo-poissons ont peu à peu été submergés et ont commencé à se détériorer. \n\n[color=yellow][entity=unit-05] J'ai l'impression que c'est un peu trop dramatique. Si tu leur accordes juste un peu d’amour et d’attention, ces petits gars-là pourront reprendre leur travail en un rien de temps. [/color]
page_fish_text_3=\n\nQualité de l'eau
page_fish_text_4=[color=yellow][entity=unit-05] Ces petites bestioles sont chargées de garder mon système de refroidissement propre. Je sais qu'elles vous sont utiles aussi, mais assurez-vous simplement qu'il y en ait toujours quelques-unes près de moi, dans les bassins qui m'entourent. J'ai les plans pour les fabriquer dans ma forge, je pourrai donc en fabriquer d'autres au fil du temps.[/color]
page_fish_text_5=\n\nServo-poisson en parfait état
page_fish_text_6=Grâce à des ressources de pointe, les servo-poisson peuvent retrouver leur forme d'origine, ce qui améliore considérablement leurs capacités.

