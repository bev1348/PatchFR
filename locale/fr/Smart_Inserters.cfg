[mod-setting-description]
si-inserters-chase-belt-items=Les bras respecteront les règles standard et suivront les objets en mouvement sur les convoyeurs.\n[color=red][font=default-bold]Avertissement :[/font] Cela peut entraîner des problèmes de performances électrique. Valeur recommandée : désactivé.[/color]
si-range-adder=Détermine comment les distances des bras sont ajustées et comment le paramètre "Portée maximale des bras robotisés" est appliqué.\n\n[font=default-bold][color=orange]"Insertion"[/color][/font]\nLa portée maximale est verrouillée sur leur portée standard. (Le paramètre de portée maximale est ignoré). Ils peuvent toutefois atteindre des cibles plus proches que leur portée standard.\n\n[font=default-bold][color=orange]"Incrémental"[/color][/font]\nLe paramètre de portée maximale agit comme un [color=green]bonus supplémentaire[/color] ajouté à leur portée standard. (Par exemple, un bras long atteint plus loin qu’un bras standard).\n\n[font=default-bold][color=orange]"Égal"[/color][/font]\nTous les bras partagent exactement la même portée maximale, définie par le paramètre "Portée maximale".\n\n[font=default-bold][color=orange]"Réinitialisation"[/color][/font]\nComme "Égal", mais leur [color=red]portée minimale[/color] est limitée à leur portée standard. (Par exemple, un bras long ne peut pas saisir un objet situé à une tuile de distance).\n\n[font=default-bold][color=orange]"Incrémental avec réinitialisation"[/color][/font]\nCombine les modes "Incrémental" et "Réinitialisation". La portée maximale bénéficie d’un bonus, mais la portée minimale est limitée à la valeur standard d’origine.\n\n[font=default-bold][color=orange]"Insertion avec réinitialisation"[/color][/font]\nLa distance de portée est strictement limitée à la portée standard d’origine. Ils ne peuvent ni s’étendre plus loin, ni se rapprocher davantage.
si-max-inserters-range=Définit la portée maximale absolue (1 à 6 tuiles) pour tous les bras.\n[color=green]Valeur recommandée = 3[/color]
si-disable-long-inserters=Masque les recettes et désactive la possibilité de fabriquer tous les bras longse de la version standard.
si-directional-inserters=Oblige les bras à ne prélever que d'un seul côté et à déposer exactement du côté opposé.
si-single-line-inserters=Empêche les bras de déposer les objets en diagonale (n'autorise que les lignes droites).
si-directional-slim-inserters=Oblige les bras compacts à ne prélever que d'un seul côté et à déposer exactement du côté opposé.
si-single-line-slim-inserters=Empêche les bras minces de déposer les objets en diagonale.
si-diagonal-technologies=Active l'arbre technologique diagonal.\n[color=yellow]Remarque : sans le niveau 1, il n'est pas possible de modifier les positions des bras.[/color]
si-range-technologies=Active l'arbre technologique de la portée.\n[color=yellow]Remarque : sans le niveau 1, il n'est pas possible de modifier les positions des bras.[/color]
si-offset-technologies=Active l'arbre technologique des décalages (permettant des micro-ajustements).
si-offset-selector=Permet d'afficher ou de masquer l'interface utilisateur relative au décalage de prise en charge/restitution dans le configurateur.
si-technologies-difficulty=Permet de sélectionner le multiplicateur de coût et le niveau de difficulté de l'arbre technologique de Smart Inserter.
si-disable-inserters-consumption=Désactive complètement la consommation électrique de tous les bras.
si-swap-clicks=Permet d'inverser les fonctions des boutons gauche et droit de la souris lors de la configuration des positions directement dans le monde.

