si-toggle=Tout modifier
si-toggle-tooltip=Cocher/décocher toutes les cases de cet onglet
si-drop=Position de dépose
si-drop-tooltip=[font=default-bold][color=orange]Copie la position de dépose.[/color][/font]\nSi l'option [color=yellow]Orientation relative[/color] est cochée, la position de collage s'orientera automatiquement pour s'aligner sur la direction de base de la destination.
si-drop-offset=Décallage de dépose
si-drop-offset-tooltip=[font=default-bold][color=orange]Copie le micro-décalage de la dépose.[/color][/font]\nCopie la position fractionnaire exacte à l'intérieur de la tuile de dépose.
si-pickup=Position de collecte
si-pickup-tooltip=[font=default-bold][color=green]Copie la position de collecte.[/color][/font]\nSi l'option [color=yellow]Orientation relative[/color] est cochée, la position de collage s'orientera automatiquement pour s'aligner sur la direction de base de la destination.
si-pickup-offset=Décallage de collecte
si-pickup-offset-tooltip=[font=default-bold][color=green]Copie le micro-décalage de la collecte.[/color][/font]\nCopie la position fractionnaire exacte à l'intérieur de la tuile de collecte.
si-si-direction=Direction d'orientation
si-si-direction-tooltip=[font=default-bold][color=yellow]Copie l'orientation physique de la base.[/color][/font]\nForce le bras de destination à orienter sa base physique exactement dans la même direction absolue que le bras source.
si-relative-si-direction=Orientation relative
si-relative-si-direction-tooltip=[font=default-bold][color=yellow]Conserve les positions par rapport à la base.[/color][/font]\nSi activé (comportement standard), les positions sont appliquées [font=default-bold]par rapport à la base du bras[/font].\nSi non, les positions sont traitées comme des décalages directionnels absolus (par exemple, si la source dépose vers le nord, la destination déposera également vers le nord, quelle que soit l'orientation de sa base).
