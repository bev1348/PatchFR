[enemy-alert]
unit-group-gather=Les ennemis se regroupent
unit-group-attack=__1__ __plural_for_parameter__1__{1=ennemi attaque|rest=ennemis attaquent}__
unit-group-expand=__1__ __plural_for_parameter__1__{1=ennemi d'étend|rest=ennemis s'étendent}__
unit-group-expand-arrive=Les ennemis construisent une nouvelle base
spawners-consuming-pollution=Nid absorbant la pollution (__1__ __plural_for_parameter__1__{1=nid|rest=nids}__)
spawners-consuming-pollution-toggle=L'alerte d'absorption de pollution est __1__
spawners-consuming-pollution-toggle-enabled=activée
spawners-consuming-pollution-toggle-disabled=désactivée

[mod-setting-name]
enemy-alert-pollution=Alerte lorsque les nids absorbent la pollution
enemy-alert-gathering=Alerte lorsque les ennemis commencent à former un groupe
enemy-alert-attack=Alerte lorsque des ennemis décident d'attaquer une zone
enemy-alert-minimum-attack-group-size=Taille minimale d'un groupe d'attaque
enemy-alert-expand=Alerte lorsque des ennemis décident de s'étendre vers une zone
enemy-alert-expand-arrive=Alerte en cas d'arrivée d'ennemis dans la zone d'expansion
enemy-alert-notification-sound=Son de notification
enemy-alert-other-surfaces=Alerte en cas d'activité sur d'autres surfaces
enemy-alert-charted-areas-only=Alerte uniquement en cas d'activité dans les zones cartographiées

[mod-setting-description]
enemy-alert-minimum-attack-group-size=N'afficher une alerte d'attaque que lorsque le groupe compte au moins ce nombre de membres. Les alertes de rassemblement et d'expansion ne sont pas concernées.
enemy-alert-expand-arrive=Déclenché lorsqu'un groupe d'ennemis arrive sur le site d'expansion et commence à construire une nouvelle base.
enemy-alert-other-surfaces=Recevez des alertes provenant d'autres planètes, de plateformes spatiales et de surfaces moddées
enemy-alert-charted-areas-only=Ne recevez des alertes que lorsque l'activité se situe dans un bloc couvert par votre force. Une couverture radar en temps réel n'est pas nécessaire

[controls]
enemy-alert-pollution-toggle=Activer/désactiver l'alerte relative à l'absorption de la pollution

