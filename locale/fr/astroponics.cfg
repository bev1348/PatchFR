[mod-setting-description]
astroponics-crude-oil=Mélanger l'excédent de boues biologiques avec des polluants pour le convertir en pétrole brut.
astroponics-gleba-crops=Gléba dans l'espace
astroponics-more-gleba=Double le rendement de l'astroponie pour les [item=yumako] et les [item=jellynut] par fabrication, le faisant passer de 20 à 40. Par défaut, l'Astroponie de Gléba constitue un cycle net négatif sans productivité en fin de partie. Ce changement rend le cycle net positif une fois prise en compte la productivité de la chambre biologique.
astroponics-garden-speed=Modifie la vitesse de fabrication du jardin spatial afin d'ajuster l'équilibre par rapport aux autres mods (valeur par défaut : 1).
astroponics-more-wood=Augmente la quantité de bois produite par Tree Astroponics de 4 à 10. Cela reflète l'équilibre ajusté lorsque Early Agriculture est installé (auquel cas ce paramètre est masqué), mais peut ne pas être équilibré vis-à-vis d'autres mods.

