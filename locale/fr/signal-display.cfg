[mod-setting-name]
sigd-update-nth-tick=Fréquence de mise à jour (en ticks)
sigd-updates-per-tick=Mises à jour par tick
sigd-search-rich-text=Mise à jour des icônes de texte enrichi
sigd-show-formatted-number=Afficher les unités SI

[mod-setting-description]
sigd-update-nth-tick=Fréquence de mise à jour de l'affichage (en ticks).\nDes valeurs plus élevées améliorent les performances en répartissant les mises à jour sur un plus grand nombre de ticks.\n\nTous les N ticks, un seul affichage sera mis à jour, sauf si cette valeur est égale à 1 (mise à jour à chaque tick). Dans ce cas, le nombre d'affichages mis à jour à chaque tick est déterminé par le paramètre "Mises à jour par tick".
sigd-updates-per-tick=[color=red]Ce paramètre ne s'applique que lorsque la fréquence de mise à jour est égale à 1 (mise à jour à chaque tick).[/color]\nNombre d'affichages à mettre à jour à chaque tick.\nPlus ce nombre est faible, meilleures sont les performances.
# The following line contains a UTF character U+FF1D (fullwidth equals sign) that is used to avoid issues with the equals sign rendering as rich text. Do not replace it with a normal equals sign.
sigd-search-rich-text=Rechercher dans le contenu du message et mettre à jour le texte enrichi avec la valeur correcte du signal.\nFormat : [item=iron-plate][]\nBrut : [item꞊iron-plate][]\nCette opération peut être [font=default-bold]très gourmande en ressources[/font].
sigd-show-formatted-number=Afficher la valeur du signal avec le suffixe SI, comme sur les écrans des circuits logiques. Désactivez cette option pour afficher le nombre exact.

