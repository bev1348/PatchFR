[technology-description]
panglia_planet_discovery_panglia=Panglia est une étrange lune luxuriante de Gleba où l'on peut trouver de l'énergie provenant de la végétation, d'étranges matériaux capables de se dupliquer et des lieux où le temps se déforme de manière surnaturelle.
panglia_branbalite_slurry=Plante très nutritive.
panglia_branbalite_slurry_to_crudeoil=Transformez la branbalite en pétrole brut.
panglia_panglite_multiplication=Le panglite est un alliage extraterrestre qui se dilate indéfiniment lorsqu'il est chauffé.
panglia_panglite_fiber=Matériau extrêmement résistant et polyvalent grâce à sa capacité d'auto-réparation sous l'effet de la chaleur.
panglia_panglite_glass=En combinant le panglite et le verre en couches minces, on peut utiliser la réfraction laser pour travailler à l'échelle microscopique.
panglia_advanced_optics_nanotech=Créer une machine à base de verre de Panglite capable de cartographier et de modifier des éléments au niveau moléculaire, tels que les génomes.
panglia_dna_manipulation=Donnez naissance à de nouveaux organismes en créant un ADN unique.
panglia_simulation_chamber=Les organismes hôtes restent dans un état de relative stabilité.
panglia_simulation_matrix=Créez une réalité virtuelle complète à laquelle vous connectez vos organismes, leur faisant vivre une existence entièrement fictive.
panglia_sentient_processor=Télécharger une conscience dans un ordinateur. La combinaison de la biologie et de l'IA pourrait être la forme la plus complète de puissance de traitement informatique.
panglia_worker-robots-speed=Refonte complète des circuits internes, permettant un fonctionnement encore plus rapide.
panglia_worker-robots-storage=Une manière plus intelligente de saisir et de transporter des objets. Les robots disposent de plus d'espace de stockage.
panglia_crusher=Broie n'importe quel matériau en une poudre composite très fine.
panglia_igneous_rock_to_lava=Faire fondre les roches ignées pour obtenir de la lave.
panglia_tech_timewarp_data=Collecter [font=moshine-data][color=#d699ff]time_flow.data[/color][/font] dans les poches de distorsion temporelle afin de comprendre comment influencer le flux temporel.
panglia_tech_timewarp_data_nocolor=Récupérez des time_flow.data dans les poches de distorsion temporelle pour comprendre comment influencer le flux temporel.
