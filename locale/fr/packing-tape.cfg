packing-tape-allow-in-rocket=Permet de placer des objets emballés dans les fusées.
packing-tape-accumulator-threshold=La charge de l'accumulateur est arrondie à la baisse au multiple de ce pourcentage afin de réduire l'encombrement des stocks. En dessous de ce seuil, l'accumulateur n'est pas emballé du tout. Cela n'affecte pas les accumulateurs déjà emballés, et les accumulateurs entièrement chargés sont emballés quel que soit le paramètre. Définissez cette valeur sur 0 pour emballer tous les accumulateurs chargés.\n\n[0 : 5 : 100]

