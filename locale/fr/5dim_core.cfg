[mod-setting-description]
5d-space-age-materials=Si activé et si le DLC de l'Ère spatiale est installé, la progression de haut niveau (5 à 10) nécessitera à la fois des matériaux planétaires dans les recettes et des packs de science planétaire dans les technologies, conformément à la progression de l'Ère spatiale de chaque module.
5d-icon-tier-overlay=Ajoute le badge indiquant le numéro de niveau sur les icônes des objets, des recettes, des technologies et des prototypes qui utilisent l'assistant de badge partagé 5Dim.
5d-icon-tier-overlay-black-background=Affiche le badge de niveau sous forme d'icône sur un fond noir. Désactivez-le pour ne conserver que le numéro de niveau.
5d-entity-tier-overlay=Affiche le numéro de niveau au-dessus des entités placées prises en charge lors de l'exécution.
5d-entity-tier-overlay-black-background=Affiche la superposition du niveau d'entité avec un fond noir derrière le chiffre. Désactivez pour ne conserver que le numéro du niveau.
5d-machine-work-factor=Facteur global de progression d'un niveau à l'autre pour les performances des machines, telles que la vitesse de fabrication, la vitesse d'extraction, la vitesse de recherche, la vitesse de pompage ou d'autres statistiques de débit similaires. Paramètre de démarrage. Valeur par défaut : 1,45
5d-machine-energy-factor=Facteur global de progression d'un niveau à l'autre pour la consommation énergétique des machines. Plus cette valeur est élevée, plus les niveaux supérieurs consomment d'énergie pour prendre en charge la mise à l'échelle en mégabases. Paramètre de démarrage. Valeur par défaut : 1,75
5d-machine-recipe-factor=Facteur de progression global de niveau à niveau pour les différences entre recettes d'amélioration des machines. Les pondérations internes de rareté empêchent les ingrédients exotiques d'augmenter aussi fortement que les matériaux structurels courants. Paramètre de démarrage. Par défaut : 1,25
5d-machine-tech-factor=Facteur global de progression d'un niveau à l'autre pour le nombre de recherches en technologie des machines. Le nombre de recherches est arrondi à des valeurs plus nettes. Paramètre de démarrage. Par défaut : 1,3
5d-machine-t10-next-tier-work=Si activé, la dernière catégorie de familles de machines prises en charge utilise la valeur de travail de la catégorie théorique suivante, faisant ainsi de la T10 une mise à niveau ultime sans augmenter sa catégorie énergétique de base. Paramètre de démarrage.
5d-machine-t10-extra-module-slots=Des emplacements de modules supplémentaires ont été ajoutés au dernier niveau des familles de machines prises en charge, en guise de bonus de fin de parcours. Paramètre de démarrage. Par défaut : 2
5d-crafting-time-multiplier=Multiplicateur pour tous les durées de fabrication (par défaut : 1,0)
5d-recipe-cost-multiplier=Multiplicateur global pour les coûts des ingrédients des recettes. S'applique à l'ajustement des quantités d'ingrédients dans l'ancien système et aux quantités de matériaux de l'Ère spatiale. Les familles de machines qui utilisent une progression des recettes par niveau sont quant à elles régies par le facteur de progression des recettes des machines. Paramètre de démarrage. (Par défaut : 1,0)
5d-spoil-time-multiplier=Multiplicateur appliqué à la durée de conservation de tous les objets périssables. Les valeurs supérieures à 1 prolongent la durée de conservation des objets. Les valeurs inférieures à 1 accélèrent leur pourrissement. Visible uniquement lorsque l'extension de l'Ère spatiale est installée. (Par défaut : 1,0)
5d-change-inventory=Nombre d'emplacements d'inventaire pour le joueur (par défaut : 60)
5d-change-stack=Multiplicateur pour la taille des piles d'objets
5d-long-reach=Distance pour la fabrication et l'ouverture des inventaires. Pour une interaction avec l'ensemble de l'écran : 125 (par défaut : 6)
5d-long-mine=Augmente la distance d'extraction de votre personnage (par défaut : 6)
5d-mining-speed=Multiplicateur de la vitesse de récupération du joueur
5d-light-radius=Rayon de la lumière autour du joueur (par défaut : 25)
5d-ores=Rendre tous les gisements de ressources inépuisables
5d-yield=Minerais illimités avec un rendement maximal (100 % minimum)
5d-tree=Réduire le volume d'encombrement des arbres pour faciliter la navigation
5d-item-start=Sélectionner les objets de départ lors de la création d'une nouvelle carte
5d-equip-start=Sélectionner l'équipement de départ lors de la création d'une nouvelle carte
5d-train-tech=Débloquer les technologies ferroviaires dès le début du jeu
5d-robot-tech=Débloquer les technologies robotiques dès le début du jeu
5d-hp=Nombre maximal de points de vie du joueur (par défaut : 250)
5d-healing=Régénération de points de vie par tick (par défaut : 0,15)
5d-stack-artillery-bullets=Permettre d'empiler jusqu'à 5 obus d'artillerie
5d-special-turrets=Active les tourelles lancant du poison, de l'acide, des obus de mortier, des lanceurs de robots et des fusées éclairantes, ainsi que leurs recettes et technologies.
5d-special-mines=Active les mines à poison et à acide, ainsi que leurs recettes et leurs technologies.
5d-bicho-spawner-hp=Multiplicateur de la santé des nids d'ennemis
5d-bicho-hp=Multiplicateur de la santé des unités ennemies
5d-bicho-healing=Multiplicateur de soins des ennemis par tick
5d-suicide=Activer les biters suicidaires qui explosent au contact
5d-exp=Activer les types d'ennemis expérimentaux
5d-worm=Activer les énormes vers et expérimentaux
5d-storage=Activer la recherche illimitée pour la taille de la cargaison du robot
5d-stack=Activer la recherche illimitée pour la capacité des bras empilables
5d-speed=Activer la recherche illimitée pour le bonus de vitesse de recherche
5d-speed-gun-turret=Activer la recherche illimitée pour la vitesse des canons et des tourelles
5d-braking=Activer la recherche illimitée sur la force de freinage des trains
5d-grid=Activer les grilles d'équipement sur les véhicules
5d-grid-override=Remplacer les grilles d'équipement sur tous les véhicules (nécessite l'activation des grilles d'équipement)

